  <script>
    Rig.fill();
    const tl = gsap.timeline({ paused: true }), A = s => Rig.at(s, "gap");

    Rig.blinks(tl, "g3", 0, A("23,0"), 1.4);
    tl.fromTo("#gap-s3", { y: 0 }, { y: -14, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, A("21,0.4"));
    // 22: the gap widens

    tl.to("#gap-s3", { x: 460, duration: 1.2, ease: "power2.inOut" }, A("22,0.35"));
    tl.to("#gap-rline", { attr: { d: "M830,330 L1550,330" }, duration: 1.2, ease: "power2.inOut" }, A("22,0.35"));
    tl.to("#gap-rend", { x: 460, duration: 1.2, ease: "power2.inOut" }, A("22,0.35"));
    tl.to("#gap-word", { x: 90, duration: 1.2, ease: "power2.inOut" }, A("22,0.35"));
    // 23: hand slams "now"
    const slam = A("23,0.72");
    tl.fromTo("#gap-hand", { opacity: 1, y: -700 }, { y: -40, duration: 0.25, ease: "power3.in" }, slam - 0.25);
    tl.to("#gap-nowtop", { y: 40, duration: 0.06 }, slam);
    tl.fromTo("#gap-burst", { opacity: 0 }, { opacity: 1, duration: 0.08 }, slam);
    tl.to("#gap-burst", { opacity: 0, duration: 0.3 }, slam + 0.35);
    tl.to("#gap-hand", { y: -700, duration: 0.4, ease: "power2.in" }, slam + 0.6);
    // 24: cold and faded
    tl.to("#gap-coldbg", { opacity: 1, duration: 0.6 }, A("24,0"));
    tl.to("#gap-snow", { opacity: 1, duration: 0.3 }, A("24,0"));
    tl.fromTo("#gap-snow", { y: 0 }, { y: 1500, duration: 6, ease: "none" }, A("24,0"));
    tl.fromTo("#gap-shiver", { x: -6 }, { x: 6, duration: 0.06, yoyo: true, repeat: 50, ease: "none" }, A("24,0.1"));
    Rig.blinks(tl, "go", A("24,0"), A("24,1") + 1.5);
    window.__timelines["gap"] = tl;
