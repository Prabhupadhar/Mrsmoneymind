  <div id="root" data-composition-id="charity" data-width="1920" data-height="1080">
    <svg id="ch-art" class="clip" data-start="0" data-duration="30" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs>
        <radialGradient id="ch-bg" cx="0.4" cy="0.55" r="0.75"><stop offset="0" stop-color="#2a4a9f"/><stop offset="1" stop-color="#111c4c"/></radialGradient>
        <g id="ch-bill">
          <rect class="rk" x="-120" y="-60" width="240" height="120" rx="12" fill="#7fd18b" stroke-width="9"/>
          <rect x="-96" y="-38" width="192" height="76" rx="8" fill="none" stroke="#2f7a45" stroke-width="5"/>
          <text y="24" text-anchor="middle" style="font-family:Hand;font-size:72px;fill:#1f5a33">$</text>
        </g>
        <path id="ch-heart" d="M0,20 C-40,-10 -30,-46 0,-30 C30,-46 40,-10 0,20 Z"/>
      </defs>
      <rect width="1920" height="1080" fill="url(#ch-bg)"/>
      <g fill="#fff" opacity="0.06"><circle cx="300" cy="160" r="4"/><circle cx="1500" cy="960" r="5"/><circle cx="1760" cy="140" r="4"/></g>

      <!-- gap between today-you and future-you -->
      <path id="ch-gap" d="M1010,300 L1010,1000" stroke="#c9d3ef" stroke-width="6" stroke-dasharray="18 18" opacity="0.5" data-in="18,0.1,fade" data-out="19,0.25"/>
      <g transform="translate(1480,640) scale(0.5)"><g id="ch-old" data-in="18,0.1,right" data-out="20,0">
        <g opacity="0.45"><g data-rig="old" data-p="cho" data-o='{"eyes":"open","mouth":"worry","look":[-20,0]}'></g></g>
      </g></g>
      <text class="pop" x="1480" y="250" text-anchor="middle" style="font-size:120px" data-in="18,0.72,pop" data-out="19,0.25,pop">a stranger?</text>

      <!-- today-you -->
      <g transform="translate(560,600) scale(0.6)"><g id="ch-kid">
        <g data-rig="kid" data-p="chk" data-o='{"mouth":"flat","brows":"flat","look":[0,10]}'></g>
      </g></g>
      <g transform="translate(560,920)"><g id="ch-wallet" data-in="16,0.3,pop" data-out="17,0.1,pop">
        <rect class="rk" x="-120" y="-80" width="240" height="160" rx="22" fill="#8a5a3c" stroke-width="10"/>
        <path class="rk" d="M-120,-30 L60,-30 C90,-30 120,-10 120,20" fill="none" stroke-width="8"/>
        <circle cx="70" cy="10" r="14" fill="#f3e6c8" class="rk" stroke-width="6"/>
      </g></g>
      <g transform="translate(560,880)"><g id="ch-hug" data-in="17,0.15,pop" data-out="18,0.05">
        <use href="#ch-bill"/>
        <path class="rk" d="M-200,40 C-150,-10 -110,-10 -70,10 M200,40 C150,-10 110,-10 70,10" fill="none" stroke="#e3a63a" stroke-width="44"/>

      <!-- arm stretches across the gap -->
      <path id="ch-arm" d="M720,860 C860,760 1040,740 1250,760" fill="none" stroke="#0d0f22" stroke-width="58" stroke-linecap="round" data-len="620" data-in="18,0.2,draw" data-out="19,0.3"/>
      <path id="ch-arm2" d="M720,860 C860,760 1040,740 1250,760" fill="none" stroke="#e3a63a" stroke-width="42" stroke-linecap="round" data-len="620" data-in="18,0.2,draw" data-out="19,0.3"/>
      <g transform="translate(1250,740)"><g id="ch-give" data-in="18,0.55,pop" data-out="19,0.3">

        <rect class="rk" x="-120" y="-20" width="240" height="90" rx="10" fill="#f7f3ea" stroke-width="7"/>

        <use href="#ch-heart" y="150" fill="#ff6f8f" class="rk" stroke-width="6"/>

      <g transform="translate(1200,560)"><g id="ch-drop" opacity="0"><use href="#ch-bill" transform="scale(0.6)"/></g></g>

      <!-- clutching the paycheck -->
      <g transform="translate(560,900)"><g id="ch-check" data-in="20,0.25,pop">
        <rect class="rk" x="-190" y="-90" width="380" height="180" rx="12" fill="#f7f3ea" stroke-width="10"/>

        <text x="160" y="50" text-anchor="end" style="font-family:Hand;font-size:62px;fill:#0d0f22">$3,200</text>

      <text class="pop" x="1380" y="560" text-anchor="middle" style="font-size:130px" data-in="20,0.55,pop">nope.</text>

  <script>
    Rig.fill();
    const tl = gsap.timeline({ paused: true }), A = s => Rig.at(s, "charity");
    tl.fromTo("#ch-kid", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0);
    Rig.run(tl, "charity");
    Rig.blinks(tl, "chk", 0, 20);
    Rig.blinks(tl, "cho", A("18,0"), A("20,0"), 0.7);
    // 17: hug the money
    Rig.mouth(tl, "chk", "flat", "smile", A("17,0.2"));
    Rig.brows(tl, "chk", "up", A("17,0.2"));
    Rig.look(tl, "chk", 0, 20, A("17,0.2"));
    tl.to("#ch-kid", { rotation: -5, svgOrigin: "0 300", duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, A("17,0.5"));
    // 18: reach toward the stranger
    Rig.look(tl, "chk", 34, 0, A("18,0.1"));
    Rig.mouth(tl, "chk", "smile", "worry", A("18,0.3"));
    Rig.brows(tl, "chk", "worry", A("18,0.3"));
    // 19: into the jar
    tl.set("#ch-drop", { opacity: 1 }, A("19,0.6"));
    tl.fromTo("#ch-drop", { y: 0 }, { y: 170, duration: 0.4, ease: "power2.in" }, A("19,0.6"));
    tl.to("#ch-drop", { opacity: 0, duration: 0.1 }, A("19,0.6") + 0.4);
    Rig.widen(tl, "chk", A("19,0.75"));
    // 20: clutch the paycheck, shake head
    Rig.look(tl, "chk", -10, 18, A("20,0.2"));
    tl.to(["#chk-p1", "#chk-p2"], { scale: 1, duration: 0.2 }, A("20,0.2"));
    Rig.brows(tl, "chk", "mad", A("20,0.4"));
    Rig.mouth(tl, "chk", "worry", "flat", A("20,0.4"));
    tl.to("#ch-kid", { rotation: 7, svgOrigin: "0 300", duration: 0.14, yoyo: true, repeat: 5, ease: "sine.inOut" }, A("20,0.5"));
    window.__timelines["charity"] = tl;
  </script>
