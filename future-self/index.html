<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f3ecdf;
        --ink: #1f1a17;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <!-- Style frames: four 3-second scenes for "The Stranger You're Robbing" -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="brain" data-composition-id="brain" data-composition-src="compositions/brain.html"
        data-start="3" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="gap" data-composition-id="gap" data-composition-src="compositions/gap.html"
        data-start="6" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="mirror" data-composition-id="mirror" data-composition-src="compositions/mirror.html"
        data-start="9" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- rich-look test scenes -->
      <div id="hookr" data-composition-id="hookr" data-composition-src="compositions/hookr.html"
        data-start="12" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="mirrorr" data-composition-id="mirrorr" data-composition-src="compositions/mirrorr.html"
        data-start="15" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- psych-style test scenes -->
      <div id="phook" data-composition-id="phook" data-composition-src="compositions/p-hook.html"
        data-start="18" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="pstr" data-composition-id="pstr" data-composition-src="compositions/p-stranger.html"
        data-start="21" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="pcard" data-composition-id="pcard" data-composition-src="compositions/p-card.html"
        data-start="24" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="ptear" data-composition-id="ptear" data-composition-src="compositions/p-tear.html"
        data-start="27" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
