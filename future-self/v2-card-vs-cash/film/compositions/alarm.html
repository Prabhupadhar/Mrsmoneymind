<template>

    #root { position: absolute; inset: 0; background: #1a2b66; overflow: hidden; }

    .lab { font-family: Hand; font-size: 64px; fill: #f4f1ff; }
  </style>
  <div id="root" data-composition-id="alarm" data-width="1920" data-height="1080">
    <svg id="al-art" class="clip" data-start="0" data-duration="30" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs>
        <radialGradient id="al-bg" cx="0.5" cy="0.55" r="0.75"><stop offset="0" stop-color="#2a4a9f"/><stop offset="1" stop-color="#111c4c"/></radialGradient>
        <g id="al-bell">
          <path class="rk" d="M-110,60 C-110,-60 -70,-130 0,-130 C70,-130 110,-60 110,60 L140,100 L-140,100 Z" fill="#ff5f6d" stroke-width="10"/>
          <circle class="rk" cx="0" cy="-145" r="18" fill="#ff5f6d" stroke-width="8"/>
          <circle class="rk" cx="0" cy="118" r="26" fill="#ffd27a" stroke-width="8"/>
        </g>
        <g id="al-bill"><rect class="rk" x="-80" y="-40" width="160" height="80" rx="8" fill="#7fd18b" stroke-width="7"/><text y="18" text-anchor="middle" style="font-family:Hand;font-size:48px;fill:#1f5a33">$</text></g>
        <g id="al-coin"><circle class="rk" r="26" fill="#ffd27a" stroke-width="6"/><text y="11" text-anchor="middle" style="font-family:Hand;font-size:32px;fill:#a8673e">$</text></g>
      </defs>
      <rect width="1920" height="1080" fill="url(#al-bg)"/>

      <g id="al-split" data-out="22,0">
        <path d="M960,120 L960,1000" stroke="#c9d3ef" stroke-width="6" stroke-dasharray="18 18" opacity="0.5"/>
        <!-- 20: cash rings the alarm loud -->
        <text class="lab" x="480" y="140" text-anchor="middle" style="font-size:80px">cash</text>
        <g transform="translate(480,380)"><g id="al-bigbell" data-in="20,0.05,pop">
          <use href="#al-bell"/>
          <g fill="none" stroke="#ffd27a" stroke-width="10" stroke-linecap="round" id="al-rings">
            <path d="M-170,-60 C-200,-20 -200,40 -170,80"/><path d="M-220,-90 C-260,-30 -260,70 -220,120"/>
            <path d="M170,-60 C200,-20 200,40 170,80"/><path d="M220,-90 C260,-30 260,70 220,120"/>
          </g>
        </g></g>
        <g transform="translate(480,800)"><g id="al-wallet" data-in="20,0.3,up">
          <rect class="rk" x="-130" y="-90" width="260" height="180" rx="24" fill="#8a5a3c" stroke-width="10"/>
          <path class="rk" d="M-130,-40 L60,-40 C96,-40 130,-14 130,20" fill="none" stroke-width="8"/>

        </g></g>
        <g transform="translate(480,760)">
          <g id="al-f1" opacity="0"><use href="#al-bill"/></g>
          <g id="al-f2" opacity="0"><use href="#al-bill"/></g>
          <g id="al-f3" opacity="0"><use href="#al-bill"/></g>
        </g>
        <text class="pop" x="480" y="660" text-anchor="middle" style="font-size:120px" data-in="20,0.25,pop">LOUD</text>

      <g transform="translate(960,560) scale(0.55)"><g id="al-kid" data-in="22,0,up">

        <g id="al-c4" opacity="0"><use href="#al-coin"/></g>

  <script>
    Rig.fill();
    const tl = gsap.timeline({ paused: true }), A = s => Rig.at(s, "alarm");
    Rig.run(tl, "alarm");
    // 20: the big bell shakes, bills fly out, the wallet gets thinner
    tl.to("#al-bigbell", { rotation: 12, svgOrigin: "0 -140", duration: 0.07, yoyo: true, repeat: 23, ease: "sine.inOut" }, A("20,0.1"));
    tl.to("#al-rings", { opacity: 0.3, duration: 0.15, yoyo: true, repeat: 11 }, A("20,0.1"));
    ["#al-f1", "#al-f2", "#al-f3"].forEach((id, i) => {
      const t = A("20," + (0.4 + i * 0.12).toFixed(2));
      tl.set(id, { opacity: 1 }, t);
      tl.fromTo(id, { x: 0, y: 0, rotation: 0 }, { x: -200 + i * 200, y: -260, rotation: -20 + i * 20, opacity: 0, duration: 0.8, ease: "power2.out" }, t);
    });
    tl.to("#al-wallet", { scaleY: 0.55, transformOrigin: "50% 100%", duration: 0.8, ease: "power2.inOut" }, A("20,0.75"));
    // 21: the small bell barely moves
    tl.to("#al-smallbell", { rotation: 4, svgOrigin: "0 -60", duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, A("21,0.3"));
    // 22: coins trickle through the crack
    ["#al-c1", "#al-c2", "#al-c3", "#al-c4"].forEach((id, i) => {
      const t = A("22," + (0.15 + i * 0.18).toFixed(2));
      tl.set(id, { opacity: 1 }, t);
      tl.fromTo(id, { x: -60 + i * 30, y: -40 }, { x: 0, y: 260, duration: 0.6, ease: "power2.in" }, t);
    });
    Rig.blinks(tl, "ak", A("22,0"), A("22,1") + 1, 0.8);
    tl.to("#ak-tears", { opacity: 1, duration: 0.4 }, A("22,0.7"));
    window.__timelines["alarm"] = tl;
  </script>
