<template>
  <style>
    @font-face { font-family: "Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); }
    #root { position: absolute; inset: 0; background: #1a2b66; overflow: hidden; }
    #hk-art { position: absolute; inset: 0; }
    .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
    .pop { font-family: Hand; font-size: 150px; fill: #ffb35c; stroke: #0d0f22; stroke-width: 14px; paint-order: stroke; stroke-linejoin: round; }
    .lab { font-family: Hand; font-size: 46px; fill: #f4f1ff; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <svg id="hk-art" class="clip" data-start="0" data-duration="30" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs>
        <radialGradient id="hk-bg" cx="0.62" cy="0.55" r="0.7"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#121f52"/></radialGradient>
        <radialGradient id="hk-glow"><stop offset="0" stop-color="#7cf0a8" stop-opacity="0.7"/><stop offset="1" stop-color="#7cf0a8" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1920" height="1080" fill="url(#hk-bg)"/>
      <g fill="#fff" opacity="0.06"><circle cx="300" cy="160" r="4"/><circle cx="520" cy="900" r="5"/><circle cx="1700" cy="200" r="4"/><circle cx="1780" cy="760" r="6"/></g>

      <!-- close-up kid -->
      <g transform="translate(1260,640) scale(0.95)"><g id="hk-kid">
        <g data-rig="kid" data-p="hk" data-o='{"mouth":"smile","brows":"up","look":[0,0]}'></g>
      </g></g>

      <!-- card reader -->
      <circle id="hk-ok" cx="520" cy="640" r="260" fill="url(#hk-glow)" opacity="0"/>
      <g transform="translate(520,700)"><g id="hk-reader" data-in="1,0.05,up">
        <rect class="rk" x="-130" y="-200" width="260" height="380" rx="30" fill="#2b2f45" stroke-width="10"/>
        <rect x="-96" y="-166" width="192" height="120" rx="12" fill="#9fb6d9"/>
        <rect id="hk-screen" x="-96" y="-166" width="192" height="120" rx="12" fill="#7cf0a8" opacity="0"/>
        <text x="0" y="-92" text-anchor="middle" style="font-family:Hand;font-size:50px;fill:#0d0f22">$47.80</text>
        <g fill="none" stroke="#c9d3ef" stroke-width="10" stroke-linecap="round">
          <path d="M-30,30 C-10,50 -10,90 -30,110"/><path d="M0,10 C30,40 30,100 0,130"/><path d="M30,-10 C70,30 70,110 30,150"/>
        </g>
      </g></g>
      <!-- hand with card -->
      <g transform="translate(300,960)"><g id="hk-hand" opacity="0">
        <g transform="rotate(-18)">
          <rect class="rk" x="-120" y="-80" width="240" height="150" rx="16" fill="#6a4fd6" stroke-width="9"/>
          <rect x="-90" y="-40" width="54" height="40" rx="6" fill="#ffd27a"/>
          <rect x="-90" y="30" width="170" height="12" rx="6" fill="#c7bcff"/>
        </g>
        <circle class="rk" cx="-80" cy="70" r="60" fill="#f4d2b6" stroke-width="9"/>
      </g></g>
      <text id="hk-beep" x="760" y="430" text-anchor="middle" style="font-family:Hand;font-size:84px;fill:#7cf0a8;stroke:#0d0f22;stroke-width:10px;paint-order:stroke" opacity="0">beep.</text>
      <text class="pop" x="560" y="250" text-anchor="middle" style="font-size:150px" data-in="2,0.05,pop">...nothing?</text>
    </svg>
  </div>
  <script>
    Rig.fill();
    const tl = gsap.timeline({ paused: true }), A = s => Rig.at(s, "hook");
    tl.fromTo("#hk-kid", { scale: 0.94, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
    Rig.run(tl, "hook");
    Rig.blinks(tl, "hk", 0, 12);
    // 0: curious brow wiggle at the camera
    tl.to("#hk-br", { y: -16, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, A("0,0.5"));
    // 1: hand brings the card in and taps
    const tap = A("1,0.5");
    tl.set("#hk-hand", { opacity: 1 }, A("1,0.15"));
    tl.fromTo("#hk-hand", { x: -320, y: 260 }, { x: 160, y: -200, duration: 0.6, ease: "power3.out" }, A("1,0.15"));
    tl.to("#hk-hand", { x: 200, y: -170, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.inOut" }, tap);
    tl.to("#hk-screen", { opacity: 1, duration: 0.1 }, tap + 0.1);
    tl.to("#hk-ok", { opacity: 1, duration: 0.2 }, tap + 0.1);
    tl.fromTo("#hk-beep", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, tap + 0.1);
    tl.to("#hk-hand", { x: -320, y: 260, duration: 0.5, ease: "power2.in" }, tap + 0.6);
    Rig.look(tl, "hk", -40, 18, A("1,0.2"));
    Rig.mouth(tl, "hk", "smile", "flat", A("1,0.75"));
    Rig.brows(tl, "hk", "flat", A("1,0.75"));
    Rig.look(tl, "hk", 0, 0, A("1,0.8"));
    // 2: shocked double take
    tl.to("#hk-beep", { opacity: 0, duration: 0.2 }, A("2,0"));
    Rig.widen(tl, "hk", A("2,0.05"));
    Rig.brows(tl, "hk", "up", A("2,0.05"));
    Rig.mouth(tl, "hk", "flat", "o", A("2,0.1"));
    tl.to("#hk-kid", { rotation: -6, svgOrigin: "0 300", duration: 0.3, ease: "back.out(2)" }, A("2,0.1"));
    Rig.look(tl, "hk", -30, 20, A("2,0.5"));
    window.__timelines["hook"] = tl;
  </script>
</template>
