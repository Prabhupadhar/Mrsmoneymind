  </style>
  <div id="root" data-composition-id="close" data-width="1920" data-height="1080">

      <rect width="1920" height="1080" fill="url(#cl-bg)"/>

      <g transform="translate(560,860)"><g id="cl-wallet" data-in="37,0.55,up">

  <script>
    Rig.fill();
    const tl = gsap.timeline({ paused: true }), A = s => Rig.at(s, "close");

    tl.fromTo("#cl-arm", { rotation: 0, svgOrigin: "120 20" }, { rotation: -25, svgOrigin: "120 20", duration: 0.25, ease: "back.out(2)" }, A("38,0.1"));
