<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #111c4c; }
      #root { width: 100%; height: 100%; position: relative; }
      #art { position: absolute; inset: 0; }
      .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
      .big { font-family: Hand; stroke: #0d0f22; stroke-width: 18px; paint-order: stroke; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <!-- Thumbnail A: "PAY DOUBLE?" — shocked kid, cash $29 vs card $61. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <svg id="art" class="clip" data-start="0" data-duration="1" viewBox="0 0 1280 720" data-layout-allow-overflow>
        <defs>
          <radialGradient id="bg" cx="0.7" cy="0.6" r="0.8"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#0b1236"/></radialGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffb35c" stop-opacity="0.85"/><stop offset="0.5" stop-color="#ff8a2a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1280" height="720" fill="url(#bg)"/>
        <circle cx="960" cy="470" r="360" fill="url(#glow)"/>
        <!-- cash, small price -->
        <g transform="translate(600,470) rotate(-8)">
          <rect class="rk" x="-120" y="-62" width="240" height="124" rx="12" fill="#7fd18b" stroke-width="10"/>
          <text y="26" text-anchor="middle" style="font-family:Hand;font-size:80px;fill:#1f5a33">$</text>
        </g>
        <text x="600" y="640" text-anchor="middle" class="big" style="font-size:110px;fill:#fff">$29</text>
        <!-- card, big price -->
        <g transform="translate(960,440) rotate(10)">
          <rect class="rk" x="-170" y="-108" width="340" height="216" rx="22" fill="#6a4fd6" stroke-width="12"/>
          <rect x="-128" y="-56" width="76" height="56" rx="8" fill="#ffd27a"/>
          <rect x="-128" y="50" width="240" height="18" rx="9" fill="#c7bcff"/>
        </g>
        <text x="980" y="680" text-anchor="middle" class="big" style="font-size:170px;fill:#ffb35c">$61</text>
        <g transform="translate(240,560) scale(0.62)">
          <g data-rig="kid" data-p="tk" data-o='{"mouth":"o","brows":"up","look":[34,-4],"sweat":true}'></g>
        </g>
        <text x="640" y="160" text-anchor="middle" class="big" style="font-size:160px;fill:#fff">PAY <tspan style="fill:#ffb35c">DOUBLE?</tspan></text>
      </svg>
    </div>
    <script>
      Rig.fill();
      gsap.set(["#tk-p1", "#tk-p2"], { scale: 1.2 });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
