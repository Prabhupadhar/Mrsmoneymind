<template>

  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <svg id="hk-art" class="clip" data-start="0" data-duration="30" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs>
        <radialGradient id="hk-bg" cx="0.5" cy="0.55" r="0.75"><stop offset="0" stop-color="#2a4a9f"/><stop offset="1" stop-color="#111c4c"/></radialGradient>
      </defs>
      <rect width="1920" height="1080" fill="url(#hk-bg)"/>
      <g fill="#fff" opacity="0.06"><circle cx="300" cy="160" r="4"/><circle cx="1500" cy="960" r="5"/><circle cx="1760" cy="140" r="4"/></g>

      <!-- 0-1: close-up question, the $20 slides in -->
      <g id="hk-close" data-out="2,0.12">
        <g transform="translate(700,680) scale(0.7)"><g id="hk-kid"><g data-rig="kid" data-p="hk" data-o='{"mouth":"smile","brows":"up","look":[0,0]}'></g></g></g>
        <g transform="translate(1400,560) rotate(-6)"><g id="hk-bill"><rect class="rk" x="-170" y="-80" width="340" height="160" rx="14" fill="#7fd18b" stroke-width="10"/>

          <text y="34" text-anchor="middle" style="font-family:Hand;font-size:100px;fill:#1f5a33">$20</text></g></g>
        <g transform="translate(1560,720)"><g id="hk-hand" opacity="0"><circle class="rk" r="56" fill="#f4d2b6" stroke-width="9"/></g></g>

      <!-- 2-4: split screen -->
      <g id="hk-split" data-in="2,0.15,fade">
        <rect id="hk-glow" x="0" y="0" width="958" height="1080" fill="#ffb35c" opacity="0"/>
        <path d="M960,80 L960,1000" stroke="#c9d3ef" stroke-width="6" stroke-dasharray="18 18" opacity="0.6"/>
        <g data-in="2,0.25,left">

  <script>
    Rig.fill();
    const tl = gsap.timeline({ paused: true }), A = s => Rig.at(s, "hook");
    Rig.run(tl, "hook");
    tl.fromTo("#hk-kid", { y: 40 }, { y: 0, duration: 0.6, ease: "expo.out" }, 0);
    Rig.blinks(tl, "hk", 0, 6);
    tl.to("#hk-br", { y: -16, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, A("0,0.5"));
    // 1: a hand slides the bill in
    tl.fromTo("#hk-bill", { x: 1200, rotation: 20 }, { x: 0, rotation: 0, duration: 0.6, ease: "power3.out" }, A("1,0.05"));
    Rig.look(tl, "hk", 50, -10, A("1,0.2"));
    Rig.mouth(tl, "hk", "smile", "grin", A("1,0.4"));
    tl.to("#hk-bill", { y: -14, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, A("1,0.7"));
    Rig.blinks(tl, "hl", A("2,0"), A("5,0")); Rig.blinks(tl, "hr", A("2,0"), A("5,0"), 0.5);
    tl.to("#hk-gift", { rotation: 8, svgOrigin: "0 70", duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, A("2,0.8"));

    tl.to("#hk-glow", { opacity: 0.18, duration: 0.4 }, A("3,0.2"));
    tl.to("#hk-lk", { y: 24, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, A("3,0.35"));
    Rig.mouth(tl, "hl", "smile", "grin", A("3,0.3"));
    // 4: wrong
    tl.to("#hk-glow", { opacity: 0, duration: 0.3 }, A("4,0.4"));
    Rig.mouth(tl, "hl", "grin", "o", A("4,0.5"));
    Rig.widen(tl, "hl", A("4,0.5"));
    Rig.brows(tl, "hl", "worry", A("4,0.5"));
    window.__timelines["hook"] = tl;
