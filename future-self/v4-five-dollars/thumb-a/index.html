<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #111c4c; }
      #root { width: 100%; height: 100%; position: relative; }
      #art { position: absolute; inset: 0; }
      .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
      .big { font-family: Hand; stroke: #0d0f22; stroke-width: 18px; paint-order: stroke; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <!-- Thumbnail A: "THE $5 HAPPINESS TEST" envelope with $5, kid hands the neighbor a coffee. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <svg id="art" class="clip" data-start="0" data-duration="1" viewBox="0 0 1280 720" data-layout-allow-overflow>
        <defs>
          <radialGradient id="bg" cx="0.7" cy="0.6" r="0.8"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#0b1236"/></radialGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/><stop offset="0.5" stop-color="#ff8a2a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1280" height="720" fill="url(#bg)"/>
        <circle cx="640" cy="470" r="380" fill="url(#glow)"/>
        <g transform="translate(640,430) rotate(-6)">
          <rect class="rk" x="-180" y="-110" width="360" height="230" rx="12" fill="#e9dcc6" stroke-width="10"/>
          <g transform="translate(0,-120) scale(0.9)"><rect class="rk" x="-170" y="-80" width="340" height="160" rx="14" fill="#7fd18b" stroke-width="10"/><rect x="-140" y="-54" width="280" height="108" rx="10" fill="none" stroke="#1f5a33" stroke-width="5" opacity="0.6"/><text y="34" text-anchor="middle" style="font-family:Hand;font-size:100px;fill:#1f5a33">$5</text></g>
          <path class="rk" d="M-180,-40 L0,60 L180,-40 L180,120 L-180,120 Z" fill="#f3e6c8" stroke-width="10"/>
        </g>
        <g transform="translate(210,560) scale(0.58)"><g data-rig="kid" data-p="tk" data-o='{"mouth":"grin","brows":"up","look":[50,-6]}'></g></g>
        <g transform="translate(1070,600) scale(0.58)"><g data-rig="nb" data-p="tn" data-o='{"mouth":"grin","brows":"up","happy":true}'></g></g>
        <g transform="translate(860,620) scale(1.2) rotate(8)"><path class="rk" d="M40,-20 C80,-20 80,30 40,30" fill="none" stroke-width="14"/><path class="rk" d="M-50,-60 L50,-60 L40,70 L-40,70 Z" fill="#f7f3ea" stroke-width="9"/><rect x="-46" y="-10" width="92" height="34" fill="#8a5a3c"/><path class="rk" d="M-56,-60 L56,-60" stroke-width="12"/></g>
        <text x="640" y="160" text-anchor="middle" class="big" style="font-size:118px;fill:#fff">THE <tspan style="fill:#ffb35c">$5</tspan> HAPPINESS TEST</text>
      </svg>
    </div>
    <script>
      Rig.fill();

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
