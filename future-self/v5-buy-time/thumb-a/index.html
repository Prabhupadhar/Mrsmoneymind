<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #111c4c; }
      #root { width: 100%; height: 100%; position: relative; }
      #art { position: absolute; inset: 0; }
      .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
      .big { font-family: Hand; stroke: #0d0f22; stroke-width: 18px; paint-order: stroke; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <!-- Thumbnail A: "ONLY 2% BUY THIS": a glowing clock with a $40 price tag, the kid stunned. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <svg id="art" class="clip" data-start="0" data-duration="1" viewBox="0 0 1280 720" data-layout-allow-overflow>
        <defs>
          <radialGradient id="bg" cx="0.7" cy="0.6" r="0.8"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#0b1236"/></radialGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/><stop offset="0.5" stop-color="#ff8a2a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1280" height="720" fill="url(#bg)"/>
        <circle cx="820" cy="460" r="360" fill="url(#glow)"/>
        <g transform="translate(820,460)">
          <circle class="rk" r="200" fill="#f7f3ea" stroke-width="14"/>
          <g fill="#0d0f22"><circle cy="-160" r="10"/><circle cx="160" r="10"/><circle cy="160" r="10"/><circle cx="-160" r="10"/></g>
          <path class="rk" d="M0,0 L0,-130" stroke-width="16"/><path class="rk" d="M0,0 L80,46" stroke-width="16"/><circle r="16" fill="#0d0f22"/>
        </g>
        <g transform="translate(1110,300) rotate(16)">
          <path class="rk" d="M-110,-60 L70,-60 L130,0 L70,60 L-110,60 Z" fill="#ffd27a" stroke-width="10"/><circle cx="70" cy="0" r="14" fill="#0d0f22"/>
          <text x="-20" y="28" text-anchor="middle" style="font-family:Hand;font-size:80px;fill:#0d0f22">$40</text></g>
        <g transform="translate(260,560) scale(0.62)"><g data-rig="kid" data-p="tk" data-o='{"mouth":"o","brows":"up","look":[60,-30],"sweat":true}'></g></g>
        <text x="640" y="150" text-anchor="middle" class="big" style="font-size:124px;fill:#fff">ONLY <tspan style="fill:#ffb35c">2%</tspan> BUY THIS</text>
      </svg>
    </div>
    <script>
      Rig.fill();

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
