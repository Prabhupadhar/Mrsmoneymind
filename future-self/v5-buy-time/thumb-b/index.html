<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #111c4c; }
      #root { width: 100%; height: 100%; position: relative; }
      #art { position: absolute; inset: 0; }
      .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
      .big { font-family: Hand; stroke: #0d0f22; stroke-width: 18px; paint-order: stroke; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <!-- Thumbnail B: "LAZY... OR HAPPIER?": the neighbor relaxes with a mug while someone mops; the kid judges. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <svg id="art" class="clip" data-start="0" data-duration="1" viewBox="0 0 1280 720" data-layout-allow-overflow>
        <defs>
          <radialGradient id="bg" cx="0.7" cy="0.6" r="0.8"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#0b1236"/></radialGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/><stop offset="0.5" stop-color="#ff8a2a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1280" height="720" fill="url(#bg)"/>
        <circle cx="760" cy="500" r="360" fill="url(#glow)"/>
        <rect class="rk" x="560" y="560" width="420" height="170" rx="40" fill="#b0263c" stroke-width="12"/>
        <g transform="translate(770,560) scale(0.5)"><g data-rig="nb" data-p="tn" data-o='{"mouth":"grin","brows":"up","happy":true}'></g></g>
        <g transform="translate(940,640)"><path class="rk" d="M30,-18 C62,-18 62,26 30,26" fill="none" stroke-width="12"/><path class="rk" d="M-38,-50 L38,-50 L30,50 L-30,50 Z" fill="#f7f3ea" stroke-width="10"/></g>
        <g transform="translate(1140,420)"><path class="rk" d="M70,-260 L0,170" stroke-width="18"/><path class="rk" d="M-80,160 C-46,136 46,136 80,160 L92,210 L-92,210 Z" fill="#c9d3ef" stroke-width="10"/></g>
        <g fill="#fff"><path d="M1060,640 l10,26 26,10 -26,10 -10,26 -10,-26 -26,-10 26,-10 z"/><path d="M1220,660 l7,18 18,7 -18,7 -7,18 -7,-18 -18,-7 18,-7 z"/></g>
        <g transform="translate(220,580) scale(0.55)"><g data-rig="kid" data-p="tk" data-o='{"mouth":"flat","brows":"mad","look":[60,0]}'></g></g>
        <text x="640" y="150" text-anchor="middle" class="big" style="font-size:124px;fill:#fff">LAZY... OR <tspan style="fill:#ffb35c">HAPPIER?</tspan></text>
      </svg>
    </div>
    <script>
      Rig.fill();

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
