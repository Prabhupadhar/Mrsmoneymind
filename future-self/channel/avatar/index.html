<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 800px; height: 800px; overflow: hidden; background: #1a2b66; }
      #root { width: 100%; height: 100%; position: relative; }
      #art { position: absolute; inset: 0; }
      .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <!-- YouTube profile picture 800x800; YouTube crops it to a circle. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="800" data-height="800">
      <svg id="art" class="clip" data-start="0" data-duration="1" viewBox="0 0 800 800" data-layout-allow-overflow>
        <defs><radialGradient id="bg" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#111c4c"/></radialGradient></defs>
        <rect width="800" height="800" fill="url(#bg)"/>
        <circle cx="400" cy="400" r="300" fill="#ff8a2a"/>
        <g transform="translate(400,440) scale(0.82)"><g data-rig="kid" data-p="ak" data-o='{"mouth":"smile","brows":"up","look":[10,-6]}'></g></g>
      </svg>
    </div>
    <script>
      Rig.fill();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
