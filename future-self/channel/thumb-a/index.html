<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #111c4c; }
      #root { width: 100%; height: 100%; position: relative; }
      #art { position: absolute; inset: 0; }
      .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
      .big { font-family: Hand; font-size: 150px; stroke: #0d0f22; stroke-width: 18px; paint-order: stroke; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <!-- Thumbnail A: "THAT'S YOU?" — you, shocked, facing a future self who is half stranger. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <svg id="art" class="clip" data-start="0" data-duration="1" viewBox="0 0 1280 720" data-layout-allow-overflow>
        <defs>
          <radialGradient id="bg" cx="0.7" cy="0.6" r="0.8"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#0b1236"/></radialGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffb35c" stop-opacity="0.85"/><stop offset="0.5" stop-color="#ff8a2a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
          <clipPath id="half"><rect x="-420" y="-520" width="420" height="1200"/></clipPath>
        </defs>
        <rect width="1280" height="720" fill="url(#bg)"/>
        <circle cx="930" cy="470" r="380" fill="url(#glow)"/>
        <g transform="translate(930,500) scale(0.62)">
          <g data-rig="old" data-p="to" data-o='{"eyes":"open","mouth":"smile","look":[-26,0]}'></g>
          <g clip-path="url(#half)"><g data-rig="sil" data-p="ts"></g></g>
        </g>
        <text x="760" y="330" text-anchor="middle" class="big" style="font-size:150px;fill:#ffb35c">?</text>
        <g transform="translate(300,540) scale(0.6)">
          <g data-rig="kid" data-p="tk" data-o='{"mouth":"o","brows":"up","look":[34,-4],"sweat":true}'></g>
        </g>
        <text x="640" y="150" text-anchor="middle" class="big" style="fill:#fff">THAT'S <tspan style="fill:#ffb35c">YOU?</tspan></text>
      </svg>
    </div>
    <script>
      Rig.fill();
      gsap.set(["#tk-p1", "#tk-p2"], { scale: 1.2 });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
