<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Hand"; src: url("assets/patrickhand.ttf") format("truetype"); font-display: block; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14215a; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #14215a; }
      #art { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .k { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
      .cap { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Hand", cursive; color: #f4f1ff; }
      #h1 { top: 220px; font-size: 118px; }
      #h1 span { display: inline-block; margin: 0 14px; }
      #h1 .hot { color: #ffb347; }
      #sub { top: 370px; font-size: 52px; color: #b9c2ff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-motion-blur="on">
      <svg id="art" class="clip" data-start="0" data-duration="5" viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="bg" cx="0.5" cy="0.52" r="0.75"><stop offset="0" stop-color="#3355b8"/><stop offset="1" stop-color="#101a4a"/></radialGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffc56b" stop-opacity="0.9"/><stop offset="0.45" stop-color="#ff8a2a" stop-opacity="0.25"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
          <linearGradient id="mugG" x1="0" x2="1"><stop offset="0" stop-color="#ff6b5a"/><stop offset="0.55" stop-color="#ff8f6e"/><stop offset="1" stop-color="#d9473a"/></linearGradient>
          <g id="heart"><path d="M0,14 C-26,-6 -30,-26 -14,-32 C-4,-36 0,-26 0,-22 C0,-26 4,-36 14,-32 C30,-26 26,-6 0,14 Z"/></g>
          <g id="spark"><path d="M0,-22 C3,-4 4,-3 22,0 C4,3 3,4 0,22 C-3,4 -4,3 -22,0 C-4,-3 -3,-4 0,-22 Z"/></g>
        </defs>
        <rect width="1080" height="1920" fill="url(#bg)"/>
        <g id="rays" opacity="0" transform="translate(540,1060)">
          <g fill="#ffffff" opacity="0.07">
            <path d="M0,0 L-90,-900 L90,-900 Z"/><path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(30)"/><path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(60)"/>
            <path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(90)"/><path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(120)"/><path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(150)"/>
            <path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(180)"/><path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(210)"/><path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(240)"/>
            <path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(270)"/><path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(300)"/><path d="M0,0 L-90,-900 L90,-900 Z" transform="rotate(330)"/>
          </g>
        </g>
        <g fill="#ffffff" opacity="0.08"><circle cx="140" cy="420" r="5"/><circle cx="930" cy="560" r="6"/><circle cx="210" cy="1380" r="4"/><circle cx="880" cy="1300" r="5"/><circle cx="520" cy="610" r="3"/></g>

        <g id="cam">
          <!-- kid, centred at (540, 960), scale 0.82 -->
          <g transform="translate(540,960) scale(0.82)"><g id="kid">
            <g id="body">
              <path class="k" d="M-330,620 C-330,360 -200,300 0,300 C200,300 330,360 330,620 Z" fill="#e3a63a" stroke-width="10"/>
              <path class="k" d="M-150,318 C-80,380 80,380 150,318" fill="#c98b2c" stroke-width="8"/>
              <path d="M-60,358 L-66,470 M60,358 L66,470" stroke="#f4f1ff" stroke-width="9" stroke-linecap="round"/>
            </g>
            <g id="head">
              <ellipse class="k" cx="-292" cy="20" rx="44" ry="66" fill="#eec2a2" stroke-width="10"/>
              <ellipse class="k" cx="292" cy="20" rx="44" ry="66" fill="#eec2a2" stroke-width="10"/>
              <circle class="k" cx="0" cy="0" r="290" fill="#f4d2b6" stroke-width="10"/>
              <path d="M150,-210 C260,-120 280,60 210,190 C270,60 250,-100 150,-210 Z" fill="#e3b394" opacity="0.7"/>
              <path class="k" d="M-302,-30 C-326,-330 300,-352 306,-40 C262,-150 160,-186 80,-146 C58,-200 -62,-206 -112,-146 C-182,-186 -272,-136 -302,-30 Z" fill="#1c1a30" stroke-width="10"/>
              <g id="tuft"><path class="k" d="M10,-300 C-6,-392 96,-410 86,-338 C72,-372 34,-362 44,-306 Z" fill="#1c1a30" stroke-width="8"/></g>
              <!-- eyes -->
              <g id="eyes">
                <ellipse class="k" cx="-104" cy="30" rx="66" ry="76" fill="#ffffff" stroke-width="9"/>
                <ellipse class="k" cx="104" cy="30" rx="66" ry="76" fill="#ffffff" stroke-width="9"/>
                <g transform="translate(-104,30)"><g id="pL">
                  <g class="pup"><circle r="42" fill="#151530"/><circle cx="15" cy="-18" r="13" fill="#fff"/><circle cx="-16" cy="18" r="6" fill="#fff"/></g>
                  <g class="hrt" opacity="0"><use href="#heart" transform="scale(1.9)" fill="#ff4f6d" stroke="#0d0f22" stroke-width="3"/></g>
                </g></g>
                <g transform="translate(104,30)"><g id="pR">
                  <g class="pup"><circle r="42" fill="#151530"/><circle cx="15" cy="-18" r="13" fill="#fff"/><circle cx="-16" cy="18" r="6" fill="#fff"/></g>
                  <g class="hrt" opacity="0"><use href="#heart" transform="scale(1.9)" fill="#ff4f6d" stroke="#0d0f22" stroke-width="3"/></g>
                </g></g>
                <!-- eyelids for blinks -->
                <ellipse id="lidL" cx="-104" cy="30" rx="70" ry="80" fill="#f4d2b6" class="k" stroke-width="9" transform="translate(-104,-50) scale(1,0) translate(104,50)"/>
                <ellipse id="lidR" cx="104" cy="30" rx="70" ry="80" fill="#f4d2b6" class="k" stroke-width="9" transform="translate(104,-50) scale(1,0) translate(-104,50)"/>
              </g>
              <path id="brL" class="k" d="M-170,-80 C-130,-96 -84,-104 -48,-100" fill="none" stroke-width="16"/>
              <path id="brR" class="k" d="M48,-100 C84,-104 130,-96 170,-80" fill="none" stroke-width="16"/>
              <path class="k" d="M0,90 C14,104 12,118 -2,124" fill="none" stroke-width="8"/>
              <ellipse id="blL" cx="-190" cy="130" rx="46" ry="28" fill="#ff8f86" opacity="0.4"/>
              <ellipse id="blR" cx="190" cy="130" rx="46" ry="28" fill="#ff8f86" opacity="0.4"/>
              <path id="m1" class="k" d="M-50,190 C-20,198 20,198 50,190" fill="none" stroke-width="9"/>
              <path id="m2" class="k" d="M-80,170 C-60,250 60,250 80,170 Z" fill="#7a2034" stroke-width="9" opacity="0"/>
            </g>
          </g></g>

          <!-- mug + hands (world space, so it can fly in) -->
          <g transform="translate(540,1330)"><g id="mugW"><g id="mug">
            <g id="steam" opacity="0" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.55">
              <path id="st1" d="M-40,-150 C-60,-190 -20,-210 -40,-250"/><path id="st2" d="M20,-150 C0,-190 40,-210 20,-250"/>
            </g>
            <path class="k" d="M110,-70 C190,-70 190,40 110,40" fill="none" stroke-width="22"/>
            <path class="k" d="M110,-70 C190,-70 190,40 110,40" fill="none" stroke="#ff8f6e" stroke-width="8"/>
            <path class="k" d="M-120,-130 L120,-130 L104,110 C100,130 -100,130 -104,110 Z" fill="url(#mugG)" stroke-width="10"/>
            <ellipse class="k" cx="0" cy="-130" rx="120" ry="26" fill="#5a2e1c" stroke-width="10"/>
            <path d="M-80,-90 L-70,80" stroke="#ffffff" stroke-opacity="0.45" stroke-width="16" stroke-linecap="round"/>
            <use href="#heart" transform="translate(10,0) scale(1.6)" fill="#ffffff" opacity="0.9"/>
          </g></g></g>
          <g id="hands" opacity="0">
            <circle class="k" cx="395" cy="1350" r="54" fill="#f4d2b6" stroke-width="9"/>
            <circle class="k" cx="690" cy="1360" r="54" fill="#eec2a2" stroke-width="9"/>
          </g>

          <!-- price tag on a string -->
          <g transform="translate(860,0)"><g id="tagW"><g id="tag">
            <path d="M0,0 L0,620" stroke="#f4f1ff" stroke-width="5"/>
            <g transform="translate(0,700) rotate(8)">
              <path class="k" d="M-120,-80 L90,-80 L140,0 L90,80 L-120,80 Z" fill="#fff6e0" stroke-width="9"/>
              <circle cx="96" cy="0" r="14" fill="#14215a" class="k" stroke-width="6"/>
              <text id="p1" x="-20" y="26" text-anchor="middle" style="font-family:'Archivo Black','Hand';font-size:60px" fill="#1d2a6b">$2.87</text>
              <text id="p2" x="-20" y="26" text-anchor="middle" style="font-family:'Archivo Black','Hand';font-size:60px" fill="#e0352b" opacity="0">$7.12</text>
            </g>
          </g></g></g>

          <g id="sparks" fill="#ffd36b">
            <use href="#spark" x="270" y="760" class="sp"/><use href="#spark" x="820" y="980" class="sp"/>
            <use href="#spark" x="300" y="1220" class="sp"/><use href="#spark" x="760" y="1450" class="sp"/>
            <use href="#heart" x="200" y="980" class="sp" fill="#ff6b86"/><use href="#heart" x="900" y="1180" class="sp" fill="#ff6b86"/>
          </g>
        </g>
      </svg>
      <div id="h1" class="cap clip" data-start="0" data-duration="5"><span>same</span><span class="hot">mug.</span></div>
      <div id="sub" class="cap clip" data-start="0" data-duration="5">buyers: $2.87 &nbsp;·&nbsp; owners: $7.12</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // camera: slow push all film, a punch-in on the twist
      tl.fromTo("#cam", { scale: 1, svgOrigin: "540 1100" }, { scale: 1.06, duration: 1.4, ease: "power2.inOut" }, 0);
      tl.to("#cam", { scale: 1.14, duration: 0.5, ease: "expo.out" }, 1.4);
      tl.to("#cam", { scale: 1.18, duration: 3.1, ease: "none" }, 1.9);

      // frame 0: mug already flying in, spinning
      tl.fromTo("#mugW", { x: 980, y: -560, rotation: -200, svgOrigin: "0 0" }, { x: 0, y: 0, rotation: 0, duration: 0.75, ease: "expo.out" }, 0);
      tl.fromTo("#mug", { scaleX: 1, scaleY: 1, svgOrigin: "0 120" }, { scaleX: 1.14, scaleY: 0.84, duration: 0.09, ease: "power2.out" }, 0.62);
      tl.to("#mug", { scaleX: 1, scaleY: 1, duration: 0.55, ease: "elastic.out(1, 0.45)" }, 0.71);
      tl.fromTo("#hands", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 0.5);
      // kid reacts on catch: head bob (overlapping action), tuft lags
      tl.fromTo("#kid", { y: 0 }, { y: 26, duration: 0.12, ease: "power2.out" }, 0.66);
      tl.to("#kid", { y: 0, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 0.78);
      tl.fromTo("#tuft", { rotation: 0, svgOrigin: "40 -306" }, { rotation: -16, duration: 0.14, ease: "power2.out" }, 0.7);
      tl.to("#tuft", { rotation: 0, duration: 0.9, ease: "elastic.out(1.2, 0.3)" }, 0.84);
      // eyes track the incoming mug, then look at it in the hands
      tl.fromTo(["#pL", "#pR"], { x: 22, y: -26 }, { x: 0, y: 26, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(["#brL", "#brR"], { y: 0 }, { y: -24, duration: 0.25, ease: "back.out(2)" }, 0.66);

      // title words
      tl.fromTo("#h1 span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.09, ease: "power4.out" }, 0.08);

      // 1.3: the tag swings in on its string (pendulum)
      tl.fromTo("#tag", { y: -980, rotation: 0, svgOrigin: "0 0" }, { y: 0, duration: 0.45, ease: "power3.out" }, 1.0);
      tl.fromTo("#tag", { rotation: 0 }, { rotation: -14, duration: 0.25, ease: "power2.out", immediateRender: false }, 1.35);
      tl.to("#tag", { rotation: 0, duration: 2.2, ease: "elastic.out(1, 0.25)" }, 1.6);

      // 1.5: ownership kicks in — eyes turn to hearts, smile, blush, rays
      tl.to("#pL .pup, #pR .pup", { opacity: 0, duration: 0.06 }, 1.5);
      tl.fromTo("#pL .hrt, #pR .hrt", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(3)" }, 1.5);
      tl.to("#m1", { opacity: 0, duration: 0.08 }, 1.5);
      tl.fromTo("#m2", { opacity: 0, scaleY: 0.3, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "back.out(2.5)" }, 1.5);
      tl.to(["#blL", "#blR"], { opacity: 0.85, duration: 0.3 }, 1.5);
      tl.fromTo("#rays", { opacity: 0, rotation: 0, svgOrigin: "540 1060" }, { opacity: 1, rotation: 40, duration: 3.5, ease: "none" }, 1.45);
      tl.fromTo("#steam", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.6);
      tl.fromTo("#st1", { y: 20 }, { y: -30, duration: 3.4, ease: "none" }, 1.6);
      tl.fromTo("#st2", { y: 0 }, { y: -40, duration: 3.4, ease: "none" }, 1.6);

      // 1.75: price flips $2.87 -> $7.12
      tl.to("#p1", { opacity: 0, scaleY: 0, transformOrigin: "50% 50%", duration: 0.12, ease: "power2.in" }, 1.75);
      tl.fromTo("#p2", { opacity: 0, scale: 1.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 1.87);

      // 2.2-5: hug — mug pulled to the chest, gentle sway (breathing)
      tl.to("#mugW", { y: -30, duration: 0.5, ease: "power2.out" }, 2.2);
      tl.to("#hands", { y: -30, duration: 0.5, ease: "power2.out" }, 2.2);
      tl.fromTo("#kid", { rotation: 0, svgOrigin: "0 600" }, { rotation: -3, duration: 0.9, ease: "sine.inOut" }, 2.3);
      tl.to("#kid", { rotation: 3, duration: 1.0, ease: "sine.inOut" }, 3.2);
      tl.to("#kid", { rotation: 0, duration: 0.8, ease: "sine.inOut" }, 4.2);

      // blinks (2 frames closed reads as a real blink)
      [0.35, 3.6].forEach(function (t) {
        tl.to(["#lidL", "#lidR"], { attr: { transform: "" }, duration: 0 }, t);
        tl.set("#lidL", { attr: { transform: "translate(-104,-50) scale(1,1) translate(104,50)" } }, t);
        tl.set("#lidR", { attr: { transform: "translate(104,-50) scale(1,1) translate(-104,50)" } }, t);
        tl.set("#lidL", { attr: { transform: "translate(-104,-50) scale(1,0) translate(104,50)" } }, t + 0.1);
        tl.set("#lidR", { attr: { transform: "translate(104,-50) scale(1,0) translate(-104,50)" } }, t + 0.1);
      });

      // sparkles twinkle in after the twist
      tl.fromTo(".sp", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.07, ease: "back.out(3)" }, 1.6);
      tl.to(".sp", { rotation: 90, duration: 3, ease: "none" }, 2.0);
      tl.to(".sp", { opacity: 0.35, duration: 0.5, stagger: { each: 0.15, yoyo: true, repeat: 3 } }, 2.4);

      tl.fromTo("#sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 2.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
