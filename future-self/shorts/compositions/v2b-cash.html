    const tl = gsap.timeline({ paused: true }), A = s => Rig.at(s, "s2cash");

    tl.to("#ck-sweat", { opacity: 1, duration: 0.25 }, A("3,0.72"));
    tl.to("#sc-kid", { x: 10, duration: 0.05, yoyo: true, repeat: 7 }, A("3,0.75"));

    tl.to("#ck-sweat", { opacity: 0, duration: 0.3 }, A("5,0"));
    tl.to("#sc-kid", { rotation: 0, svgOrigin: "0 300", duration: 0.3 }, A("5,0"));
    Rig.look(tl, "ck", -40, 0, A("5,0.1"));
    Rig.brows(tl, "ck", "up", A("5,0.1"));
    tl.to("#sc-ouch-body", { y: -14, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, A("5,0.3"));
    const f = A("5,0.62");
    tl.set("#sc-card", { opacity: 1 }, f);
    tl.fromTo("#sc-card", { x: 500, y: -300, rotation: 20 }, { x: 0, y: 0, rotation: -8, duration: 0.45, ease: "power3.out" }, f);
    tl.set("#sc-slip", { opacity: 1 }, f + 0.45);
    tl.fromTo("#sc-slip", { x: 160, scale: 0.4, transformOrigin: "50% 50%" }, { x: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, f + 0.45);
    tl.to("#sc-o-smile", { opacity: 0, duration: 0.1 }, f + 0.8);
    tl.to("#sc-o-sad", { opacity: 1, duration: 0.1 }, f + 0.8);
    tl.to("#sc-hat", { y: 220, x: -160, rotation: -40, opacity: 0, duration: 0.6, ease: "power2.in" }, f + 0.9);
    Rig.mouth(tl, "ck", "smile", "o", f + 0.8);
    Rig.widen(tl, "ck", f + 0.8);
    window.__timelines["s2cash"] = tl;
