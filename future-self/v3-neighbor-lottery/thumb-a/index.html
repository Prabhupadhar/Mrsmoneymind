<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #111c4c; }
      #root { width: 100%; height: 100%; position: relative; }
      #art { position: absolute; inset: 0; }
      .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
      .big { font-family: Hand; stroke: #0d0f22; stroke-width: 18px; paint-order: stroke; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <!-- Thumbnail A: "HIS WIN. YOUR LOSS?" grinning neighbor with the check, worried kid with a cracked piggy bank. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <svg id="art" class="clip" data-start="0" data-duration="1" viewBox="0 0 1280 720" data-layout-allow-overflow>
        <defs>
          <radialGradient id="bg" cx="0.7" cy="0.6" r="0.8"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#0b1236"/></radialGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/><stop offset="0.5" stop-color="#ff8a2a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1280" height="720" fill="url(#bg)"/>
        <circle cx="980" cy="470" r="380" fill="url(#glow)"/>
        <rect x="760" y="230" width="18" height="28" fill="#ff8a2a" transform="rotate(20 760 230)"/><rect x="880" y="200" width="18" height="28" fill="#8f7dff" transform="rotate(-30 880 200)"/><rect x="1010" y="240" width="18" height="28" fill="#7cf0a8" transform="rotate(50 1010 240)"/><rect x="1140" y="210" width="18" height="28" fill="#ffd27a" transform="rotate(-10 1140 210)"/><rect x="1220" y="300" width="18" height="28" fill="#ff5f6d" transform="rotate(35 1220 300)"/><rect x="700" y="330" width="18" height="28" fill="#9fe3ff" transform="rotate(-40 700 330)"/>
        <g transform="translate(990,420) scale(0.55)"><g data-rig="nb" data-p="tn" data-o='{"mouth":"grin","brows":"up","happy":true}'></g></g>
        <g transform="translate(1000,630) rotate(-5) scale(0.8)">
          <rect class="rk" x="-230" y="-80" width="460" height="160" rx="12" fill="#f7f3ea" stroke-width="10"/>
          <rect x="-230" y="-80" width="460" height="34" rx="12" fill="#7fd18b"/>
          <text y="56" text-anchor="middle" style="font-family:Hand;font-size:100px;fill:#1f5a33">$29,000</text>
        </g>
        <g transform="translate(470,590) scale(0.42)">
          <path class="rk" d="M-150,120 L-150,210 L-90,210 L-90,140 M90,140 L90,210 L150,210 L150,120" fill="#ff9fb8" stroke-width="12"/>
          <ellipse class="rk" cx="0" cy="0" rx="280" ry="210" fill="#ffb3c7" stroke-width="14"/>
          <path class="rk" d="M-140,-170 L-170,-270 L-60,-200 Z" fill="#ff9fb8" stroke-width="12"/>
          <ellipse class="rk" cx="290" cy="20" rx="56" ry="70" fill="#ff9fb8" stroke-width="12"/>
          <circle cx="170" cy="-50" r="18" fill="#0d0f22"/>
          <path d="M10,-200 L-30,-120 L30,-60 L-20,20 L40,90 L0,200" fill="none" stroke="#0d0f22" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(220,580) scale(0.6)"><g data-rig="kid" data-p="tk" data-o='{"mouth":"o","brows":"worry","look":[40,0],"sweat":true}'></g></g>
        <text x="640" y="160" text-anchor="middle" class="big" style="font-size:150px;fill:#fff">HIS WIN. <tspan style="fill:#ffb35c">YOUR LOSS?</tspan></text>
      </svg>
    </div>
    <script>
      Rig.fill();
      gsap.set(["#tk-p1", "#tk-p2"], { scale: 1.2 });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
