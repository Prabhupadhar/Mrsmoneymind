<template>
  <style>
    @font-face { font-family: "Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); }
    #root { position: absolute; inset: 0; background: #1a2b66; overflow: hidden; }
    #hk-art { position: absolute; inset: 0; }
    .rk { stroke: #0d0f22; stroke-linecap: round; stroke-linejoin: round; }
    .pop { font-family: Hand; font-size: 150px; fill: #ffb35c; stroke: #0d0f22; stroke-width: 14px; paint-order: stroke; stroke-linejoin: round; }
    .lab { font-family: Hand; font-size: 46px; fill: #f4f1ff; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <svg id="hk-art" class="clip" data-start="0" data-duration="30" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs>
        <radialGradient id="hk-bg" cx="0.65" cy="0.45" r="0.8"><stop offset="0" stop-color="#2d4fa8"/><stop offset="1" stop-color="#121f52"/></radialGradient>
        <radialGradient id="hk-glow"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.7"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
        <clipPath id="hk-win-clip"><rect x="170" y="250" width="540" height="560" rx="18"/></clipPath>
      </defs>
      <rect width="1920" height="1080" fill="url(#hk-bg)"/>
      <g fill="#fff" opacity="0.06"><circle cx="1000" cy="140" r="4"/><circle cx="1700" cy="120" r="5"/><circle cx="1380" cy="300" r="4"/></g>

      <!-- neighbor's house and lawn -->
      <path d="M880,880 C1200,850 1600,850 1920,870 L1920,1080 L880,1080 Z" fill="#2f7c52"/>
      <path d="M880,880 C1200,850 1600,850 1920,870" fill="none" stroke="#0d0f22" stroke-width="8"/>
      <g transform="translate(1440,560)">
        <rect class="rk" x="-300" y="-120" width="600" height="340" fill="#e9dcc6" stroke-width="10"/>
        <path class="rk" d="M-350,-110 L0,-340 L350,-110 Z" fill="#c2504a" stroke-width="10"/>
        <rect class="rk" x="-60" y="40" width="120" height="180" rx="8" fill="#6a4fd6" stroke-width="9"/>
        <rect class="rk" x="-240" y="-40" width="130" height="110" rx="8" fill="#ffd27a" stroke-width="9"/>
        <rect class="rk" x="110" y="-40" width="130" height="110" rx="8" fill="#ffd27a" stroke-width="9"/>
        <path d="M-175,-40 L-175,70 M-240,15 L-110,15 M175,-40 L175,70 M110,15 L240,15" stroke="#0d0f22" stroke-width="6"/>
      </g>
      <circle id="hk-glow-c" cx="1440" cy="700" r="460" fill="url(#hk-glow)" opacity="0"/>

      <!-- the neighbor jumps in with a giant check -->
      <g transform="translate(1440,590) scale(0.55)"><g id="hk-nb">
        <g data-rig="nb" data-p="hn" data-o='{"mouth":"grin","brows":"up","happy":true}'></g>
      </g></g>
      <g transform="translate(1440,950)"><g id="hk-check">
        <rect class="rk" x="-300" y="-120" width="600" height="240" rx="14" fill="#f7f3ea" stroke-width="10"/>
        <rect x="-300" y="-120" width="600" height="46" rx="14" fill="#7fd18b"/>
        <text x="-270" y="-84" style="font-family:Hand;font-size:34px;fill:#1f5a33">LOTTERY WIN</text>
        <path d="M-260,90 L-40,90" stroke="#0d0f22" stroke-width="5"/>
        <path d="M160,70 C180,40 200,100 220,70 C240,40 250,90 270,70" fill="none" stroke="#0d0f22" stroke-width="5"/>
        <text id="hk-amt" x="0" y="40" text-anchor="middle" style="font-family:Hand;font-size:120px;fill:#1f5a33">$29,000</text>
      </g></g>
      <g id="hk-confetti" opacity="0">
        <rect x="1100" y="200" width="22" height="34" fill="#ff8a2a" transform="rotate(20 1100 200)"/>
        <rect x="1250" y="140" width="22" height="34" fill="#8f7dff" transform="rotate(-30 1250 140)"/>
        <rect x="1390" y="220" width="22" height="34" fill="#7cf0a8" transform="rotate(50 1390 220)"/>
        <rect x="1530" y="120" width="22" height="34" fill="#ffd27a" transform="rotate(-10 1530 120)"/>
        <rect x="1680" y="200" width="22" height="34" fill="#ff5f6d" transform="rotate(35 1680 200)"/>
        <rect x="1800" y="150" width="22" height="34" fill="#9fe3ff" transform="rotate(-40 1800 150)"/>
        <rect x="1170" y="320" width="22" height="34" fill="#ffd27a" transform="rotate(10 1170 320)"/>
        <rect x="1620" y="330" width="22" height="34" fill="#8f7dff" transform="rotate(60 1620 330)"/>
        <circle cx="1320" cy="300" r="12" fill="#ff5f6d"/><circle cx="1750" cy="300" r="12" fill="#7cf0a8"/><circle cx="1460" cy="160" r="12" fill="#ff8a2a"/>
      </g>

      <!-- the kid's wall and window -->
      <rect x="0" y="0" width="880" height="1080" fill="#24387e"/>
      <rect x="0" y="0" width="880" height="1080" fill="none" stroke="#0d0f22" stroke-width="10"/>
      <rect x="170" y="250" width="540" height="560" rx="18" fill="#3a5ab8"/>
      <g clip-path="url(#hk-win-clip)">
        <g transform="translate(440,610) scale(0.6)"><g id="hk-kid">
          <g data-rig="kid" data-p="hk" data-o='{"mouth":"flat","brows":"flat","look":[40,0]}'></g>
        </g></g>
        <g transform="translate(600,720)"><g id="hk-hand" opacity="0">
          <circle class="rk" r="44" fill="#f4d2b6" stroke-width="8"/>
          <path class="rk" d="M-30,-30 L-36,-76 M-8,-40 L-8,-90 M16,-38 L22,-86 M36,-22 L52,-62" fill="none" stroke-width="18"/>
          <path d="M-30,-30 L-36,-76 M-8,-40 L-8,-90 M16,-38 L22,-86 M36,-22 L52,-62" fill="none" stroke="#f4d2b6" stroke-width="8" stroke-linecap="round"/>
        </g></g>
      </g>
      <rect class="rk" x="170" y="250" width="540" height="560" rx="18" fill="none" stroke-width="12"/>
      <path d="M440,250 L440,520" stroke="#0d0f22" stroke-width="10" opacity="0.5"/>
      <rect class="rk" x="140" y="800" width="600" height="40" rx="10" fill="#f3e6c8" stroke-width="10"/>
      <path d="M180,250 L180,820 C150,700 140,400 180,250 Z M700,250 L700,820 C730,700 740,400 700,250 Z" fill="#ff8a2a" opacity="0.85"/>
    </svg>
  </div>
  <script>
    Rig.fill();
    const tl = gsap.timeline({ paused: true }), A = s => Rig.at(s, "hook");
    tl.fromTo("#hk-kid", { y: 40 }, { y: 0, duration: 0.6, ease: "expo.out" }, 0);
    Rig.run(tl, "hook");
    Rig.blinks(tl, "hk", 0, 10);
    // 0: curious glance out the window
    tl.to("#hk-br", { y: -16, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, A("0,0.5"));
    Rig.look(tl, "hk", 44, -10, A("0,0.3"));
    // 1: the neighbor jumps up with the check, confetti falls
    const win = A("1,0.1");
    tl.fromTo("#hk-nb", { y: 1400 }, { y: 0, duration: 0.5, ease: "back.out(1.4)" }, win);
    tl.fromTo("#hk-check", { y: 500, rotation: 0 }, { y: 0, rotation: -4, duration: 0.5, ease: "back.out(1.4)" }, win + 0.05);
    tl.to(["#hk-nb", "#hk-check"], { y: -60, duration: 0.22, yoyo: true, repeat: 7, ease: "power2.out" }, win + 0.6);
    tl.set("#hk-confetti", { opacity: 1 }, win + 0.3);
    tl.fromTo("#hk-confetti", { y: -300 }, { y: 520, duration: 5, ease: "none" }, win + 0.3);
    tl.to("#hk-glow-c", { opacity: 1, duration: 0.4 }, win + 0.3);
    Rig.widen(tl, "hk", A("1,0.4"));
    Rig.brows(tl, "hk", "up", A("1,0.4"));
    Rig.mouth(tl, "hk", "flat", "o", A("1,0.4"));
    // 2: the amount lands
    tl.fromTo("#hk-amt", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2.2)" }, A("2,0.55"));
    Rig.look(tl, "hk", 44, 30, A("2,0.5"));
    // 3: smiles and gives a small wave
    Rig.mouth(tl, "hk", "o", "smile", A("3,0"));
    Rig.brows(tl, "hk", "flat", A("3,0"));
    tl.set("#hk-hand", { opacity: 1 }, A("3,0.05"));
    tl.fromTo("#hk-hand", { y: 200 }, { y: 0, duration: 0.3, ease: "back.out(1.6)" }, A("3,0.05"));
    tl.to("#hk-hand", { rotation: 18, svgOrigin: "0 40", duration: 0.16, yoyo: true, repeat: 5, ease: "sine.inOut" }, A("3,0.35"));
    // 4: the smile freezes
    const fr = A("4,0.15");
    tl.to("#hk-hand", { y: 200, duration: 0.35, ease: "power2.in" }, fr);
    Rig.look(tl, "hk", 0, 0, fr);
    Rig.brows(tl, "hk", "worry", fr);
    tl.to("#hk-sweat", { opacity: 1, duration: 0.25 }, fr + 0.2);
    tl.to("#hk-art", { scale: 1.06, transformOrigin: "25% 50%", duration: 1.2, ease: "power2.out" }, fr);
    window.__timelines["hook"] = tl;
  </script>
</template>
