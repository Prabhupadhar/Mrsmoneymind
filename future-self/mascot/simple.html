<!doctype html><html><body style="margin:0">
<svg width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#3f4290"/><g id="c"></g></svg>
<script>
const O='#2b1d14',SK='#f4c7a1';
function card(i,cx,bg,o){
  let s=`<clipPath id="k${i}"><rect x="${cx-220}" y="110" width="440" height="760" rx="36"/></clipPath><rect x="${cx-220}" y="110" width="440" height="760" rx="36" fill="${bg}"/><g clip-path="url(#k${i})">`;
  const hy=430;
  s+=o.back||'';
  s+=`<path d="M${cx-190},900 Q${cx-190},610 ${cx},600 Q${cx+190},610 ${cx+190},900Z" fill="${o.top}" stroke="${O}" stroke-width="5"/>`;
  s+=`<rect x="${cx-26}" y="${hy+100}" width="52" height="70" rx="20" fill="${SK}" stroke="${O}" stroke-width="5"/>`;
  s+=`<circle cx="${cx}" cy="${hy}" r="130" fill="${SK}" stroke="${O}" stroke-width="5"/>`;
  s+=o.hair||'';
  s+=o.face;
  s+=`<circle cx="${cx-74}" cy="${hy+52}" r="18" fill="#ff8f8f" opacity=".45"/><circle cx="${cx+74}" cy="${hy+52}" r="18" fill="#ff8f8f" opacity=".45"/>`;
  s+=(o.prop||'')+'</g>';
  s+=`<g font-family="Arial" text-anchor="middle"><text x="${cx}" y="935" font-size="56" font-weight="900" fill="#f5c04a">${o.k}</text><text x="${cx}" y="985" font-size="26" fill="#fff">${o.d}</text></g>`;
  return s;
}
const eyes=(cx,y,kind)=>[-46,46].map(dx=>kind==='happy'?`<path d="M${cx+dx-14},${y+4} q14,-16 28,0" stroke="${O}" stroke-width="6" fill="none" stroke-linecap="round"/>`:
  `<ellipse cx="${cx+dx}" cy="${y}" rx="11" ry="15" fill="${O}"/><circle cx="${cx+dx+4}" cy="${y-5}" r="4" fill="#fff"/>`).join('');
const brows=(cx,y,tilt)=>[-46,46].map(dx=>`<path d="M${cx+dx-16},${y+(dx<0?tilt:-tilt)} L${cx+dx+16},${y+(dx<0?-tilt:tilt)}" stroke="${O}" stroke-width="6" stroke-linecap="round"/>`).join('');
let h='';
// A: phone, checking balance, a little worried
h+=card(0,240,'#8fd3c7',{k:'A',d:'checks her balance, winces',top:'#ffffff',
 back:`<path d="M330,330 Q420,360 400,520 Q390,580 360,600 Q380,500 340,420Z" fill="#3a2418"/>`,
 hair:`<path d="M110,440 Q110,290 240,290 Q370,290 370,440 Q340,340 240,345 Q150,345 110,440Z" fill="#3a2418" stroke="${O}" stroke-width="5"/>`,
 face:eyes(240,440)+brows(240,395,8)+`<ellipse cx="240" cy="505" rx="14" ry="10" fill="${O}"/>`,
 prop:`<rect x="190" y="660" width="100" height="170" rx="16" fill="#2b2f45" stroke="${O}" stroke-width="5"/><rect x="200" y="675" width="80" height="130" rx="8" fill="#e8f4ff"/><text x="240" y="748" text-anchor="middle" font-family="Arial" font-weight="900" font-size="26" fill="#ff4f6d">$12.40</text><circle cx="175" cy="760" r="26" fill="${SK}" stroke="${O}" stroke-width="5"/><circle cx="305" cy="760" r="26" fill="${SK}" stroke="${O}" stroke-width="5"/>`});
// B: coffee, calm and content
h+=card(1,720,'#f7c9a8',{k:'B',d:'coffee in hand, calm about money',top:'#e2574c',
 back:`<circle cx="720" cy="300" r="60" fill="#1f1714"/>`,
 hair:`<path d="M590,450 Q585,300 720,295 Q855,300 850,450 Q820,370 750,360 Q700,390 620,380 Q600,400 590,450Z" fill="#1f1714" stroke="${O}" stroke-width="5"/>`,
 face:eyes(720,445,'happy')+brows(720,400,0)+`<path d="M690,495 q30,26 60,0" stroke="${O}" stroke-width="6" fill="none" stroke-linecap="round"/>`,
 prop:`<path d="M690,650 q-10,-30 5,-50 M730,650 q-10,-30 5,-50" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".8"/><rect x="660" y="670" width="110" height="120" rx="18" fill="#fff" stroke="${O}" stroke-width="5"/><path d="M770,700 q40,0 40,30 q0,30 -40,30" stroke="${O}" stroke-width="10" fill="none"/><circle cx="650" cy="750" r="26" fill="${SK}" stroke="${O}" stroke-width="5"/>`});
// C: shopping bag, guilty grin
h+=card(2,1200,'#c3b6ff',{k:'C',d:'"I only went in for one thing"',top:'#3e7bd8',
 back:`<path d="M1075,450 Q1060,280 1200,280 Q1340,280 1325,450 L1330,560 Q1300,580 1290,540 L1110,540 Q1100,580 1070,560Z" fill="#8a4a2b"/>`,
 hair:`<path d="M1070,440 Q1070,295 1200,292 Q1330,295 1330,440 Q1270,330 1180,350 Q1120,360 1070,440Z" fill="#8a4a2b" stroke="${O}" stroke-width="5"/>`,
 face:eyes(1200,445)+brows(1200,400,6)+`<path d="M1160,495 q40,30 80,0 Z" fill="#fff" stroke="${O}" stroke-width="5" stroke-linejoin="round"/><path d="M1300,380 q10,20 0,30 q-10,-10 0,-30" fill="#7fd0ff"/>`,
 prop:`<path d="M1255,640 q30,-40 60,0" stroke="${O}" stroke-width="7" fill="none"/><rect x="1235" y="640" width="100" height="130" rx="10" fill="#ff7eb6" stroke="${O}" stroke-width="5"/><text x="1285" y="718" text-anchor="middle" font-family="Arial" font-weight="900" font-size="30" fill="#fff">SALE</text><circle cx="1285" cy="630" r="24" fill="${SK}" stroke="${O}" stroke-width="5"/>`});
// D: notebook budget, proud
h+=card(3,1680,'#ffe08a',{k:'D',d:'figured out her budget, proud',top:'#2f9e6a',
 hair:`<path d="M1540,580 Q1525,290 1680,288 Q1835,290 1820,580 Q1795,600 1790,560 L1795,470 Q1790,360 1700,352 L1680,380 L1660,352 Q1570,360 1565,470 L1570,560 Q1560,600 1540,580Z" fill="#1f1714" stroke="${O}" stroke-width="5"/>`,
 face:[1634,1726].map(x=>`<circle cx="${x}" cy="440" r="34" fill="none" stroke="${O}" stroke-width="5"/>`).join('')+`<line x1="1668" y1="440" x2="1692" y2="440" stroke="${O}" stroke-width="5"/>`+eyes(1680,440)+brows(1680,390,0)+`<path d="M1645,492 q35,32 70,0" stroke="${O}" stroke-width="6" fill="none" stroke-linecap="round"/>`,
 prop:`<rect x="1600" y="650" width="160" height="190" rx="10" fill="#fff" stroke="${O}" stroke-width="5"/><text x="1680" y="690" text-anchor="middle" font-family="Arial" font-weight="900" font-size="24" fill="${O}">BUDGET</text>`+[720,760,800].map(y=>`<path d="M1618,${y} l10,10 l18,-20" stroke="#2f9e6a" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="1660" y="${y-6}" width="80" height="10" rx="5" fill="#ddd"/>`).join('')+`<circle cx="1595" cy="760" r="26" fill="${SK}" stroke="${O}" stroke-width="5"/>`});
document.getElementById('c').innerHTML=h;
</script></body></html>
