<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #10233a; }
  .t { top: 220px; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="32" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85"><stop offset="0" stop-color="#2f5e94"/><stop offset="1" stop-color="#081322"/></radialGradient>
      <g id="door"><rect class="k" x="-160" y="-300" width="320" height="600" rx="10" fill="#8a3a2a" stroke-width="9"/><rect x="-120" y="-250" width="240" height="200" rx="8" fill="#a24a36"/><rect x="-120" y="-10" width="240" height="250" rx="8" fill="#a24a36"/><circle cx="110" cy="20" r="18" fill="#ffd36b"/></g>
      <g id="hanger"><rect class="k" x="-70" y="-30" width="140" height="210" rx="12" fill="#fff6e0" stroke-width="6"/><circle cy="0" r="22" fill="#10233a"/>
        <rect class="k" x="-46" y="60" width="40" height="40" rx="6" fill="#fff" stroke-width="5"/><path d="M-40,80 L-28,94 L-8,64" fill="none" stroke="#2f8a52" stroke-width="8" stroke-linecap="round"/>
        <rect x="6" y="66" width="46" height="10" rx="4" fill="#c9ced8"/><rect x="6" y="84" width="34" height="10" rx="4" fill="#c9ced8"/><rect x="-46" y="120" width="96" height="10" rx="4" fill="#c9ced8"/><rect x="-46" y="140" width="80" height="10" rx="4" fill="#c9ced8"/></g>
      <g id="house"><path class="k" d="M-70,-20 L0,-80 L70,-20 Z" fill="#ff7a5c" stroke-width="6"/><rect class="k" x="-58" y="-20" width="116" height="90" fill="#fff6e0" stroke-width="6"/><rect x="-14" y="22" width="28" height="48" fill="#8a3a2a"/></g>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
      <g id="s5" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="32"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="32"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="32"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="32"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="32"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;

// ---------- S1: HOOK — door with a ticked "do not disturb" hanger; fundraiser's jar drains −30% ----------
K.add("#s1", '<g transform="translate(330,960)"><use href="#door"/><g transform="translate(110,40)"><g id="hg"><use href="#hanger"/></g></g></g>' +
  K.person("fr", "neighbor", { x: 790, y: 1060, s: 0.34, flip: true }) +
  '<g transform="translate(790,1400)"><g id="jar"><path class="k" d="M-80,-90 L80,-90 L72,80 C70,96 -70,96 -72,80 Z" fill="#ffffff" fill-opacity="0.2" stroke="#d6e6ff" stroke-width="7"/>' +
  '<rect id="coins" x="-62" y="-40" width="124" height="120" rx="10" fill="#ffd36b"/><text y="-110" text-anchor="middle" class="num" font-size="44" fill="#fff">DONATE</text></g></g>' +
  '<text id="m30" x="540" y="1480" text-anchor="middle" class="num" font-size="76" fill="#ff7a5c" opacity="0">−30%</text>');
K.show(tl, "#s1", 0);
K.hook(tl, "#t1", "one <b>do-not-disturb</b> box. donations: <b>−30%.</b>", V[1] - 0.2);
tl.fromTo("#hg", { rotation: -30, svgOrigin: "0 0" }, { rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.4)" }, 0);
tl.fromTo("#coins", { scaleY: 1, svgOrigin: "0 80" }, { scaleY: 0.7, duration: 0.8, ease: "power2.in" }, 0.4);
K.pop(tl, "#m30", 1.0, 0.4);
K.face(tl, "fr", { m: "o", br: 12, look: [-40, 0] }, 0.5);
K.react(tl, "fr", 0.6);
K.words("#t2", "want to give? or can't say <b>no?</b>"); K.title(tl, "#t2", V[1]);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[2] - 0.2);

// ---------- S2: 7,668 doors near Chicago, 2008; flyer the day before ----------
K.add("#s2", '<text id="n7" x="540" y="560" text-anchor="middle" class="num" font-size="120" fill="#fff">0</text>' +
  '<text x="540" y="640" text-anchor="middle" class="lbl" font-size="54" fill="#d6e6ff">doors · near Chicago · 2008</text>' +
  [0, 1, 2, 3, 4].map(function (i) { return '<g transform="translate(' + (170 + i * 185) + ',820)"><g class="hs"><use href="#house"/></g></g>'; }).join("") +
  '<g transform="translate(540,1180)"><g id="fly" opacity="0"><rect class="k" x="-300" y="-170" width="600" height="340" rx="20" fill="#fff6e0" stroke-width="8"/>' +
  '<text y="-80" text-anchor="middle" class="num" font-size="40" fill="#10233a">WE\'LL KNOCK TOMORROW</text><text y="-10" text-anchor="middle" class="num" font-size="60" fill="#c2185b">4–5 PM</text>' +
  '<g id="ob" opacity="0"><rect class="k" x="-230" y="40" width="64" height="64" rx="8" fill="#fff" stroke-width="6"/><path d="M-220,72 L-200,94 L-172,50" fill="none" stroke="#2f8a52" stroke-width="10" stroke-linecap="round"/>' +
  '<text x="-140" y="90" class="lbl" font-size="48" fill="#10233a">do not disturb</text></g></g></g>');
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
K.counter(tl, "#n7", 0, 7668, V[2] + 0.2, 1.3);
tl.fromTo(".hs", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, stagger: 0.1, ease: "back.out(2)", immediateRender: false }, V[2] + 0.4);
K.pop(tl, "#fly", V[3] + 0.2, 0.5);
K.pop(tl, "#ob", V[4] - 0.2, 0.5);

// ---------- S3: door opened −25% with opt-out; giving −30%, mostly gifts ≤ $10 ----------
K.add("#s3", '<g class="lbl" font-size="52" fill="#d6e6ff"><text x="290" y="560" text-anchor="middle">opened the door</text><text x="790" y="560" text-anchor="middle">gave money</text></g>' +
  '<line x1="100" y1="1200" x2="1000" y2="1200" stroke="#d6e6ff" stroke-width="6"/>' +
  '<rect class="k" id="o1" x="140" y="760" width="130" height="440" fill="#9aa6b6" stroke-width="7"/><rect class="k" id="o2" x="300" y="870" width="130" height="330" fill="#ff7a5c" stroke-width="7"/>' +
  '<rect class="k" id="g1" x="640" y="760" width="130" height="440" fill="#9aa6b6" stroke-width="7"/><rect class="k" id="g2" x="800" y="892" width="130" height="308" fill="#ff7a5c" stroke-width="7"/>' +
  '<text id="v25" x="365" y="840" text-anchor="middle" class="num" font-size="60" fill="#fff" opacity="0">−25%</text>' +
  '<text id="v30" x="865" y="862" text-anchor="middle" class="num" font-size="60" fill="#fff" opacity="0">−30%</text>' +
  '<g class="lbl" font-size="40" fill="#d6e6ff"><text x="205" y="1250" text-anchor="middle">no flyer</text><text x="365" y="1250" text-anchor="middle">box</text><text x="705" y="1250" text-anchor="middle">no flyer</text><text x="865" y="1250" text-anchor="middle">box</text></g>' +
  '<text id="sm" x="540" y="1400" text-anchor="middle" class="num" font-size="56" fill="#ffd36b" opacity="0">mostly gifts of $10 or less</text>');
K.cut(tl, "#s2", "#s3", V[4] - 0.3 + 1.6);
tl.set(["#o1", "#o2", "#g1", "#g2"], { scaleY: 0, svgOrigin: "0 1200" }, 0);
tl.to(["#o1", "#o2"], { scaleY: 1, duration: 0.5, stagger: 0.3, ease: "expo.out" }, V[4] + 1.6);
K.pop(tl, "#v25", V[4] + 2.3, 0.5);
tl.to(["#g1", "#g2"], { scaleY: 1, duration: 0.5, stagger: 0.3, ease: "expo.out" }, V[5] + 0.3);
K.pop(tl, "#v30", V[5] + 1.0, 1.6);
K.pop(tl, "#sm", V[5] + 2.0, 0.5);
K.camera(tl, "#cam", [[V[5] + 1.0, 1.05, -40, 0, 0.3], [V[6] - 0.3, 1, 0, 0, 0.3]]);

// ---------- S4: mail or online: 1 household of 7,668 ----------
K.add("#s4", '<g transform="translate(540,760)"><g id="env"><rect class="k" x="-230" y="-130" width="460" height="260" rx="16" fill="#fff6e0" stroke-width="8"/><path d="M-230,-130 L0,30 L230,-130" fill="none" stroke="#10233a" stroke-width="8"/></g></g>' +
  '<text x="540" y="1000" text-anchor="middle" class="lbl" font-size="54" fill="#d6e6ff">gave by mail or online instead</text>' +
  '<text id="one" x="540" y="1240" text-anchor="middle" class="num" font-size="200" fill="#ffd36b" opacity="0">1</text>' +
  '<text x="540" y="1340" text-anchor="middle" class="lbl" font-size="52" fill="#d6e6ff">household, of 7,668</text>');
K.cut(tl, "#s3", "#s4", V[6] - 0.3);
tl.fromTo("#env", { y: -300, rotation: -12 }, { y: 0, rotation: 0, duration: 0.5, ease: "back.out(2)", immediateRender: false }, V[6]);
K.pop(tl, "#one", V[6] + 1.6, 1.4);

// ---------- S5: payoff + loop — the awkward "no" ≈ $3.50; the box lets you skip it ----------
K.add("#s5", '<g transform="translate(330,960)"><use href="#door"/><g transform="translate(110,40)"><use href="#hanger"/></g></g>' +
  '<g transform="translate(820,820)"><g id="tag"><path class="k" d="M-250,-70 L120,-70 L190,0 L120,70 L-250,70 Z" fill="#ffd36b" stroke-width="8"/><circle cx="130" cy="0" r="14" fill="#10233a"/>' +
  '<text x="-60" y="-6" text-anchor="middle" class="num" font-size="52" fill="#10233a">≈ $3.50</text><text x="-60" y="44" text-anchor="middle" class="lbl" font-size="34" fill="#10233a">saying no (local charity)</text></g></g>' +
  K.person("kid", "kid", { x: 790, y: 1200, s: 0.3 }));
K.cut(tl, "#s4", "#s5", V[7] - 0.3);
tl.fromTo("#tag", { rotation: -25, svgOrigin: "190 0" }, { rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.4)", immediateRender: false }, V[7]);
K.words("#t4", "the price of an awkward <b>no</b>"); K.title(tl, "#t4", V[7]);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[8] - 0.2);
K.face(tl, "kid", { m: "frown", br: 12, sweat: 1, look: [-40, -20] }, V[7] + 0.4);
K.face(tl, "kid", { m: "smile", e: "h", br: 0, sweat: 0, blush: 0.7, look: [-40, 0] }, V[8] + 0.6);
K.react(tl, "kid", V[8] + 0.6);
K.words("#t5", "one little box. giving <b>−30%.</b>"); K.title(tl, "#t5", V[8]);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
