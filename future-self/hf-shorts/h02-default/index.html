<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #123d3a; }
  .t { top: 220px; font-size: 100px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="35" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.55" r="0.8"><stop offset="0" stop-color="#1f7a6d"/><stop offset="1" stop-color="#0c2b2a"/></radialGradient>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
      <g id="s5" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="35"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;

// a big toggle switch (track + knob); knob inner group is what moves
function toggle(id, x, y, s) {
  return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')"><rect class="k" x="-200" y="-90" width="400" height="180" rx="90" fill="#5b6470" stroke-width="12" id="' + id + '-track"/>' +
    '<text x="-95" y="22" text-anchor="middle" class="num" font-size="60" fill="#fff" id="' + id + '-on" opacity="0">ON</text>' +
    '<text x="95" y="22" text-anchor="middle" class="num" font-size="60" fill="#c7ccd6" id="' + id + '-off">OFF</text>' +
    '<g id="' + id + '-knob"><circle class="k" cx="-110" cy="0" r="72" fill="#fff" stroke-width="10"/></g></g>';
}
function flipOn(id, t) {
  tl.to("#" + id + "-knob", { x: 220, duration: 0.35, ease: "back.out(2)" }, t);
  tl.to("#" + id + "-track", { fill: "#3fd17a", duration: 0.2 }, t);
  tl.to("#" + id + "-off", { opacity: 0, duration: 0.1 }, t);
  tl.to("#" + id + "-on", { opacity: 1, duration: 0.2 }, t + 0.15);
}

// ---------- S1: hook — the switch flips, 37% -> 86% ----------
K.add("#s1", toggle("sw", 540, 1180, 1.3) +
  '<text id="pct" x="540" y="820" text-anchor="middle" class="num" font-size="260" fill="#fff">37%</text>' +
  '<text x="540" y="920" text-anchor="middle" class="lbl" font-size="64" fill="#bfeee6">signed up for retirement savings</text>');
K.show(tl, "#s1", 0);
tl.fromTo("#sw-knob", { x: -60 }, { x: 0, duration: 0.6, ease: "elastic.out(1,0.4)" }, 0);
flipOn("sw", 1.0);
K.counter(tl, "#pct", 37, 86, 1.0, 1.2, function (v) { return Math.round(v) + "%"; });
tl.to("#pct", { fill: "#7dff9a", duration: 0.3 }, 1.6);
K.words("#t1", "one <b>switch.</b>"); K.title(tl, "#t1", 0.2);
tl.to("#t1", { opacity: 0, duration: 0.2 }, V[1] - 0.2);
// "you've probably got this switch at work": a work badge pops in
K.add("#s1", '<g transform="translate(540,1420)"><g id="badge" opacity="0"><rect class="k" x="-210" y="-52" width="420" height="104" rx="20" fill="#fff" stroke-width="7"/><text y="18" text-anchor="middle" class="lbl" font-size="58" fill="#1d2a6b">your job, too?</text></g></g>');
K.pop(tl, "#badge", V[1] + 0.2, 0.5);

// ---------- S2: the company, April 1998, the form ----------
K.add("#s2",
  '<g transform="translate(540,880)"><rect class="k" x="-300" y="-330" width="600" height="560" rx="10" fill="#e9eef5" stroke-width="10"/>' +
  '<g fill="#7fb0d6">' + (function () { var m = ""; for (var r = 0; r < 5; r++) for (var c = 0; c < 4; c++) m += '<rect x="' + (-250 + c * 130) + '" y="' + (-290 + r * 95) + '" width="90" height="60" rx="6"/>'; return m; })() + '</g>' +
  '<rect class="k" x="-60" y="130" width="120" height="100" fill="#3d4a7a" stroke-width="8"/></g>' +
  '<g transform="translate(830,520)"><g id="cal"><rect class="k" x="-120" y="-110" width="240" height="220" rx="16" fill="#fff" stroke-width="9"/><rect x="-115" y="-105" width="230" height="64" rx="10" fill="#d8432f"/>' +
  '<text y="-56" text-anchor="middle" class="num" font-size="46" fill="#fff">APR</text><text y="62" text-anchor="middle" class="num" font-size="84" fill="#1d2a6b">1998</text></g></g>' +
  K.person("boss", "boss", { x: 250, y: 1380, s: 0.42 }));
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
K.pop(tl, "#cal", V[2] + 1.2, 0.3);
K.face(tl, "boss", { m: "smile", look: [20, 0] }, V[2] + 0.3);
K.react(tl, "boss", V[2] + 0.4);
K.words("#t2", "one big company"); K.title(tl, "#t2", V[2]);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[3] - 0.2);

// ---------- S3: before (you sign up) vs after (signed up for you) ----------
K.add("#s3",
  '<g transform="translate(540,880)"><rect class="k" x="-330" y="-380" width="660" height="760" rx="20" fill="#fffdf6" stroke-width="10"/>' +
  '<text y="-290" text-anchor="middle" class="num" font-size="56" fill="#1d2a6b">RETIREMENT PLAN</text>' +
  '<g fill="#cfd6e4"><rect x="-260" y="-210" width="520" height="22" rx="11"/><rect x="-260" y="-160" width="440" height="22" rx="11"/><rect x="-260" y="-110" width="480" height="22" rx="11"/></g>' +
  '<rect class="k" x="-260" y="-10" width="120" height="120" rx="14" fill="#fff" stroke-width="10"/>' +
  '<path id="tick" class="k" d="M-238,50 L-206,86 L-152,6" fill="none" stroke="#18a35a" stroke-width="22" opacity="0"/>' +
  '<text x="-100" y="70" class="lbl" font-size="62" fill="#1d2a6b">enroll me</text>' +
  '<g transform="translate(150,250)"><g id="later"><rect x="-150" y="-60" width="300" height="120" fill="#ffd36b" class="k" stroke-width="6"/><text y="20" text-anchor="middle" class="lbl" font-size="64" fill="#8a5a00">later...</text></g></g></g>' +
  '<g transform="translate(860,1230)"><g id="pen"><path class="k" d="M-20,-200 L20,-200 L20,40 L0,90 L-20,40 Z" fill="#3d4a7a" stroke-width="8"/></g></g>');
K.cut(tl, "#s2", "#s3", V[3] - 0.3);
K.words("#t3", "<b>before:</b> sign yourself up"); K.title(tl, "#t3", V[3]);
tl.fromTo("#pen", { x: 0, y: 0, rotation: 0 }, { x: -40, y: -20, rotation: -12, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, V[3] + 0.3);
K.pop(tl, "#later", V[3] + 1.2, 0.2);
tl.to("#t3", { opacity: 0, duration: 0.2 }, V[4] - 0.2);
K.words("#t4", "<b>after:</b> signed up for you"); K.title(tl, "#t4", V[4]);
tl.to("#later", { opacity: 0, y: 80, duration: 0.3 }, V[4] + 0.1);
tl.fromTo("#tick", { opacity: 0, strokeDasharray: 200, strokeDashoffset: 200 }, { opacity: 1, strokeDashoffset: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, V[4] + 0.5);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[5] - 0.2);
// same pay / same plan / same match chips
K.add("#s3", '<g id="chips">' + ["same pay", "same plan", "same match"].map(function (w, i) {
  return '<g transform="translate(540,' + (1370 + i * 0) + ')"><g class="chip" id="chip' + i + '" opacity="0"><rect class="k" x="-150" y="-46" width="300" height="92" rx="46" fill="#1d2a6b" stroke="#bfeee6" stroke-width="6"/><text y="18" text-anchor="middle" class="lbl" font-size="50" fill="#fff">' + w + '</text></g></g>';
}).join("") + '</g>');
[0, 1, 2].forEach(function (i) {
  tl.fromTo("#chip" + i, { opacity: 0, x: (i - 1) * 320, y: 40 }, { opacity: 1, x: (i - 1) * 320, y: 0, duration: 0.35, ease: "back.out(2)", immediateRender: false }, V[5] + i * 0.55);
});

// ---------- S4: the two groups, 100 people each ----------
K.add("#s4",
  '<text x="280" y="560" text-anchor="middle" class="lbl" font-size="60" fill="#ffd0b0">sign yourself up</text>' +
  '<text x="800" y="560" text-anchor="middle" class="lbl" font-size="60" fill="#c8ffd9">signed up for you</text>' +
  '<text id="n1" x="280" y="1420" text-anchor="middle" class="num" font-size="120" fill="#ff9a3c" opacity="0">37%</text>' +
  '<text id="n2" x="800" y="1420" text-anchor="middle" class="num" font-size="120" fill="#7dff9a" opacity="0">86%</text>');
K.grid("#s4", "ga", 100, 650, 10, 40, 14, "#5d7f7b");
K.grid("#s4", "gb", 620, 650, 10, 40, 14, "#5d7f7b");
K.cut(tl, "#s3", "#s4", V[6] - 0.3);
K.fillGrid(tl, "ga", 37, "#ff9a3c", V[6] + 0.6, 1.6);
K.pop(tl, "#n1", V[6] + 2.3);
K.fillGrid(tl, "gb", 86, "#7dff9a", V[7] + 0.3, 1.2);
K.pop(tl, "#n2", V[7] + 0.5, 1.8);
K.camera(tl, "#cam", [[V[7] + 0.2, 1.06, -20, -20, 0.4], [V[8] - 0.4, 1, 0, 0, 0.5]]);
K.words("#t5", "first year or so"); K.title(tl, "#t5", V[6]);
tl.to("#t5", { opacity: 0, duration: 0.2 }, V[8] - 0.3);

// ---------- S5: the twist — stuck at the default; then the kid checks the switch ----------
K.add("#s5",
  '<g transform="translate(540,800)"><path d="M-260,0 A260,260 0 0 1 260,0" stroke-linecap="round" fill="none" stroke="#bfeee6" stroke-width="40"/>' +
  '<g class="lbl" font-size="44" fill="#bfeee6"><text x="-250" y="60" text-anchor="middle">1%</text><text x="250" y="60" text-anchor="middle">15%</text></g>' +
  '<g id="needle"><path d="M0,0 L-200,-60" stroke="#ff4f6d" stroke-width="18" stroke-linecap="round"/><circle class="k" r="30" fill="#ff4f6d" stroke-width="8"/></g>' +
  '<text y="140" text-anchor="middle" class="num" font-size="110" fill="#fff">3%</text>' +
  '<text y="220" text-anchor="middle" class="lbl" font-size="58" fill="#bfeee6">parked in the safest fund</text>' +
  '<path id="web" d="M-300,-260 L-200,-160 M-300,-200 Q-250,-210 -240,-260 M-300,-140 Q-220,-160 -180,-260" fill="none" stroke="#e8f4f2" stroke-width="4" opacity="0"/></g>' +
  K.person("kid2", "kid", { x: 300, y: 1290, s: 0.4 }) + toggle("sw2", 760, 1330, 0.8));
K.cut(tl, "#s4", "#s5", V[8] - 0.3);
tl.fromTo("#needle", { rotation: 0, svgOrigin: "0 0" }, { rotation: 4, duration: 0.12, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, V[8] + 0.6);
tl.to("#web", { opacity: 0.8, duration: 0.8 }, V[8] + 1.6);
K.face(tl, "kid2", { m: "o", br: 14, look: [20, -30] }, V[8] + 0.6);
// loop line: the kid checks their own switch
K.face(tl, "kid2", { m: "smile", br: 0, look: [40, 10] }, V[9] + 0.6);
flipOn("sw2", V[9] + 1.2);
K.react(tl, "kid2", V[9] + 1.3);
K.blink(tl, "kid2", V[9] + 2.4);
K.sway(tl, "kid2", V[9] + 1.6, window.DUR);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
