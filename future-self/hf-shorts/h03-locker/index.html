<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #3a1846; }
  .t { top: 220px; font-size: 100px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="34" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.55" r="0.8"><stop offset="0" stop-color="#7a3a8c"/><stop offset="1" stop-color="#25102e"/></radialGradient>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
      <g id="s5" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t6" class="cap t clip" data-start="0" data-duration="34"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;

function locker(id, x, y, s) {  // a gym locker; the door is #id-door (hinged on its left edge)
  return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
    '<rect class="k" x="-170" y="-330" width="340" height="660" rx="12" fill="#2b2f45" stroke-width="10"/>' +
    '<g id="' + id + '-door"><rect class="k" x="-160" y="-320" width="320" height="640" rx="8" fill="#5c7cfa" stroke-width="8"/>' +
    '<g fill="#3a55c9"><rect x="-90" y="-260" width="180" height="16" rx="8"/><rect x="-90" y="-220" width="180" height="16" rx="8"/><rect x="-90" y="-180" width="180" height="16" rx="8"/></g>' +
    '<g id="' + id + '-lock"><path class="k" d="M70,-10 C70,-70 150,-70 150,-10" fill="none" stroke="#c9ced8" stroke-width="16"/><rect class="k" x="56" y="-14" width="108" height="96" rx="14" fill="#ffd36b" stroke-width="8"/><circle cx="110" cy="30" r="12" fill="#8a5a00"/></g></g></g>';
}
var IPOD = '<rect class="k" x="-60" y="-100" width="120" height="200" rx="20" fill="#f4f1ff" stroke-width="8"/><circle class="k" cx="0" cy="36" r="36" fill="#dfe4ff" stroke-width="6"/><rect x="-44" y="-82" width="88" height="70" rx="8" fill="#5c7cfa"/>';

// ---------- S1: hook — the iPod flies into a locker, the lock snaps, a coin pays for it ----------
K.add("#s1", locker("lk", 540, 1000, 1) +
  '<g transform="translate(540,1000)"><g id="ipod">' + IPOD + '</g></g>' +
  '<g transform="translate(860,700)"><g id="coin1" opacity="0"><circle class="k" r="60" fill="#ffd36b" stroke-width="8"/><text y="26" text-anchor="middle" class="num" font-size="72" fill="#c98b2c">$</text></g></g>');
K.show(tl, "#s1", 0);
tl.set("#lk-door", { scaleX: 0.15, svgOrigin: "-160 0" }, 0);
tl.fromTo("#ipod", { x: -520, y: -520, rotation: -260, scale: 1.2 }, { x: 0, y: 0, rotation: 0, scale: 0.8, duration: 0.7, ease: "expo.out" }, 0);
tl.to("#lk-door", { scaleX: 1, duration: 0.25, ease: "power4.in" }, 0.75);
tl.fromTo("#lk-lock", { y: -40, rotation: -20, svgOrigin: "110 30" }, { y: 0, rotation: 0, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 1.0);
tl.fromTo("#coin1", { opacity: 1, y: -300, rotation: 0 }, { y: 0, rotation: 360, duration: 0.55, ease: "bounce.out", immediateRender: false }, 1.2);
K.hook(tl, "#t1", "they <b>paid</b> to lock their own iPod away", null);
K.camera(tl, "#cam", [[1.0, 1.06, 0, 0, 0.15], [1.15, 1, 0, 0, 0.5]]);
tl.to("#t1", { opacity: 0, duration: 0.2 }, V[1] - 0.2);
K.add("#s1", K.person("kid", "kid", { x: 250, y: 1270, s: 0.36 }));
tl.fromTo("#kid", { y: 600, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, V[1]);
K.face(tl, "kid", { e: "s", m: "o", br: 14 }, V[1] + 0.1);
K.face(tl, "kid", { e: "n", m: "smile", br: 0, look: [30, -10] }, V[1] + 1.4);
K.react(tl, "kid", V[1] + 1.4);
K.words("#t2", "sounds <b>crazy?</b>"); K.title(tl, "#t2", V[1] + 0.1);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[2] - 0.2);

// ---------- S2: 226 people, a gym, addictive audiobooks ----------
K.add("#s2", '<text id="cnt" x="540" y="620" text-anchor="middle" class="num" font-size="220" fill="#fff">0</text>' +
  '<text x="540" y="720" text-anchor="middle" class="lbl" font-size="64" fill="#e6c9f0">students &amp; staff · fall 2011</text>' +
  '<g transform="translate(540,1080)"><g id="dumb"><rect class="k" x="-200" y="-18" width="400" height="36" rx="18" fill="#c9ced8" stroke-width="8"/>' +
  '<rect class="k" x="-260" y="-90" width="70" height="180" rx="16" fill="#ff4f6d" stroke-width="8"/><rect class="k" x="190" y="-90" width="70" height="180" rx="16" fill="#ff4f6d" stroke-width="8"/></g></g>' +
  '<g id="books">' + [0, 1, 2, 3].map(function (i) {
    var col = ["#ff9a3c", "#7dff9a", "#9fe3ff", "#ffd36b"][i];
    return '<g transform="translate(' + (300 + i * 160) + ',1330)"><g class="book" id="bk' + i + '" opacity="0"><rect class="k" x="-60" y="-110" width="120" height="220" rx="10" fill="' + col + '" stroke-width="8"/><path d="M-40,-70 L40,-70 M-40,-40 L30,-40" stroke="#0d0f22" stroke-width="8" stroke-linecap="round"/>' +
      '<path class="k" d="M-26,40 C-26,10 26,10 26,40" fill="none" stroke-width="8"/><rect class="k" x="-34" y="36" width="16" height="30" rx="6" fill="#0d0f22" stroke-width="2"/><rect class="k" x="18" y="36" width="16" height="30" rx="6" fill="#0d0f22" stroke-width="2"/></g></g>';
  }).join("") + '</g>');
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
K.counter(tl, "#cnt", 0, 226, V[2] + 0.2, 1.4);
K.pop(tl, "#dumb", V[2] + 1.6, 0.3);
tl.to("#dumb", { y: -40, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, V[2] + 2.2);
[0, 1, 2, 3].forEach(function (i) {
  tl.fromTo("#bk" + i, { opacity: 0, y: -400, rotation: (i % 2 ? 20 : -20) }, { opacity: 1, y: 0, rotation: (i % 2 ? 4 : -4), duration: 0.5, ease: "bounce.out", immediateRender: false }, V[3] + i * 0.15);
});
K.words("#t3", "<b>addictive</b> audiobooks"); K.title(tl, "#t3", V[3]);
tl.to("#t3", { opacity: 0, duration: 0.2 }, V[4] - 0.2);

// ---------- S3: the rule — listen only at the gym; next chapter = next workout ----------
K.add("#s3", locker("lk2", 820, 1040, 0.62) +
  K.person("kid2", "kid", { x: 380, y: 980, s: 0.5 }) +
  '<g id="phones"><path class="k" d="M240,850 C240,760 520,760 520,850" fill="none" stroke="#0d0f22" stroke-width="22"/>' +
  '<rect class="k" x="214" y="830" width="50" height="90" rx="16" fill="#ff4f6d" stroke-width="7"/><rect class="k" x="496" y="830" width="50" height="90" rx="16" fill="#ff4f6d" stroke-width="7"/></g>' +
  '<g transform="translate(380,1310)"><rect class="k" x="-300" y="-20" width="600" height="60" rx="30" fill="#2b2f45" stroke-width="8"/><g id="belt" fill="#5c6477">' +
  (function () { var m = ""; for (var b = 0; b < 12; b++) m += '<rect x="' + (-280 + b * 60) + '" y="-6" width="26" height="32" rx="6"/>'; return m; })() + '</g></g>' +
  '<g transform="translate(540,1440)"><rect class="k" x="-330" y="-34" width="660" height="68" rx="34" fill="#2b2f45" stroke="#e6c9f0" stroke-width="6"/>' +
  '<rect id="prog" x="-322" y="-26" width="0" height="52" rx="26" fill="#7dff9a"/><text y="-56" text-anchor="middle" class="lbl" font-size="56" fill="#e6c9f0">next chapter...</text></g>');
K.cut(tl, "#s2", "#s3", V[4] - 0.3);
tl.set("#lk2-door", { scaleX: -0.6, svgOrigin: "-160 0" }, V[4]);
K.words("#t4", "<b>only</b> at the gym"); K.title(tl, "#t4", V[4]);
tl.to("#belt", { x: -60, duration: 0.3, repeat: Math.round((V[6] - V[4]) / 0.3), ease: "none" }, V[4]);
tl.to("#kid2", { y: -18, duration: 0.15, yoyo: true, repeat: Math.round((V[6] - V[4]) / 0.15), ease: "sine.inOut" }, V[4]);
K.face(tl, "kid2", { m: "smile", look: [0, -10], blush: 0.8 }, V[4] + 0.4);
tl.to("#prog", { attr: { width: 644 }, duration: V[6] - V[5], ease: "none" }, V[5]);
K.blink(tl, "kid2", V[5] + 1);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[6] - 0.2);

// ---------- S4: +51% the first week, then it faded ----------
K.add("#s4", '<line x1="160" y1="1300" x2="920" y2="1300" stroke="#e6c9f0" stroke-width="6"/>' +
  '<rect class="k" id="cb" x="220" y="' + (1300 - 380) + '" width="240" height="380" fill="#9aa3b8" stroke-width="8"/>' +
  '<rect class="k" id="tb" x="620" y="' + (1300 - 380 * 1.51) + '" width="240" height="' + 380 * 1.51 + '" fill="#7dff9a" stroke-width="8"/>' +
  '<text x="340" y="1370" text-anchor="middle" class="lbl" font-size="54" fill="#e6c9f0">no locker</text><text x="740" y="1370" text-anchor="middle" class="lbl" font-size="54" fill="#e6c9f0">locker deal</text>' +
  '<text id="plus" x="740" y="' + (1300 - 380 * 1.51 - 40) + '" text-anchor="middle" class="num" font-size="110" fill="#7dff9a" opacity="0">+51%</text>' +
  '<g transform="translate(880,560)"><g id="leaf" opacity="0"><path class="k" d="M0,-70 C60,-40 60,40 0,70 C-60,40 -60,-40 0,-70 Z" fill="#ff9a3c" stroke-width="7"/><path d="M0,-60 L0,60" stroke="#8a3a00" stroke-width="6"/></g></g>');
K.cut(tl, "#s3", "#s4", V[6] - 0.3);
tl.fromTo("#cb", { scaleY: 0, svgOrigin: "340 1300" }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, V[6] + 0.2);
tl.fromTo("#tb", { scaleY: 0, svgOrigin: "740 1300" }, { scaleY: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, V[6] + 0.5);
K.pop(tl, "#plus", V[6] + 1.1, 1.6);
K.words("#t5", "first <b>week</b>"); K.title(tl, "#t5", V[6]);
tl.to("#t5", { opacity: 0, duration: 0.2 }, V[7] - 0.2);
// faded by Thanksgiving: the green bar sinks, a falling leaf
tl.to("#tb", { scaleY: 0.72, svgOrigin: "740 1300", duration: 1.4, ease: "power2.inOut" }, V[7] + 0.3);
tl.to("#plus", { opacity: 0, duration: 0.3 }, V[7] + 0.3);
tl.fromTo("#leaf", { opacity: 1, y: -200, rotation: -30 }, { y: 300, rotation: 60, duration: 2.2, ease: "sine.inOut", immediateRender: false }, V[7] + 0.2);
tl.to("#leaf", { opacity: 0, duration: 0.3 }, V[7] + 2.2);

// ---------- S5: the twist — 61% would pay to lock their own iPod; then the loop ----------
K.add("#s5", '<text id="p61" x="540" y="640" text-anchor="middle" class="num" font-size="200" fill="#ffd36b">0%</text>' +
  '<text x="540" y="740" text-anchor="middle" class="lbl" font-size="58" fill="#e6c9f0">would pay to lock their own iPod</text>');
K.grid("#s5", "gp", 270, 860, 10, 60, 20, "#6e5a78");
K.cut(tl, "#s4", "#s5", V[8] - 0.35);
K.counter(tl, "#p61", 0, 61, V[8] + 0.1, 0.9, function (v) { return Math.round(v) + "%"; });
K.fillGrid(tl, "gp", 61, "#ffd36b", V[8] + 0.1, 0.9);
K.camera(tl, "#cam", [[V[8], 1.08, 0, -40, 0.3], [V[8] + 1.5, 1, 0, 0, 0.8]]);
K.words("#t6", "lock the <b>fun</b> to the <b>chore</b>"); K.title(tl, "#t6", V[9]);
tl.to(".gp", { opacity: 0.25, duration: 0.4 }, V[9]);
tl.to("#p61", { opacity: 0.25, duration: 0.4 }, V[9]);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
