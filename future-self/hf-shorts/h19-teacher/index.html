<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #14301e; }
  .t { top: 220px; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="33" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="33" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85"><stop offset="0" stop-color="#3a7a4e"/><stop offset="1" stop-color="#0a1c10"/></radialGradient>
      <g id="cash"><rect class="k" x="-120" y="-60" width="240" height="120" rx="12" fill="#7dd88f" stroke-width="7"/><circle r="34" fill="none" stroke="#1d5a32" stroke-width="6"/><text y="14" text-anchor="middle" class="num" font-size="40" fill="#1d5a32">$</text></g>
      <g id="board"><rect class="k" x="-200" y="-130" width="400" height="260" rx="14" fill="#1f3d2a" stroke="#8a5a2a" stroke-width="14"/></g>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="33"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="33"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="33"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="33"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="33"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;

// ---------- S1: HOOK — $4,000 lands in the teacher's hands; the board's score climbs ----------
K.add("#s1", '<g transform="translate(780,720)"><g id="bd"><use href="#board"/><text id="sc" y="30" text-anchor="middle" class="num" font-size="110" fill="#fff6e0">B</text><text x="120" y="-50" text-anchor="middle" class="num" font-size="60" fill="#7dff9a" id="up" opacity="0">↑</text></g></g>' +
  K.person("tch", "friend", { x: 330, y: 1130, s: 0.4 }) +
  '<g transform="translate(330,1390)"><g id="c1"><use href="#cash"/></g></g>' +
  '<text id="k4" x="600" y="1412" text-anchor="middle" class="num" font-size="60" fill="#ffd36b" opacity="0">$4,000</text>');
K.show(tl, "#s1", 0);
K.hook(tl, "#t1", "<b>$4,000</b> up front. their students scored <b>higher.</b>", V[1] - 0.2);
tl.fromTo("#c1", { y: -300, rotation: -30 }, { y: 0, rotation: 0, duration: 0.55, ease: "bounce.out" }, 0);
K.pop(tl, "#k4", 0.4, 0.4);
tl.set("#sc", { textContent: "A" }, 1.0);
tl.fromTo("#sc", { scale: 1.4, svgOrigin: "0 0" }, { scale: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false }, 1.0);
K.pop(tl, "#up", 1.0, 0.4);
K.face(tl, "tch", { m: "o", br: 12, look: [0, 40] }, 0.3);
K.face(tl, "tch", { m: "smile", e: "h", blush: 0.8, look: [40, -20] }, 1.0);
K.react(tl, "tch", 1.0);
K.words("#t2", "same bonus. different <b>timing.</b>"); K.title(tl, "#t2", V[1]);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[2] - 0.2);

// ---------- S2: 9 schools, 2010. Lane A: up to $8,000 at year end. Lane B: $4,000 day one, give back if short ----------
K.add("#s2", '<text x="540" y="520" text-anchor="middle" class="num" font-size="52" fill="#fff">9 schools · near Chicago · 2010</text>' +
  '<g id="la" opacity="0"><rect class="k" x="90" y="640" width="900" height="300" rx="24" fill="#0a1c10" stroke="#c9ced8" stroke-width="6"/>' +
  '<text x="140" y="720" class="num" font-size="50" fill="#c9ced8">END OF YEAR</text><text x="140" y="800" class="lbl" font-size="48" fill="#e6f5ea">earn up to $8,000</text>' +
  '<g transform="translate(830,800)"><rect class="k" x="-90" y="-90" width="180" height="180" rx="14" fill="#fff6e0" stroke-width="7"/><rect x="-90" y="-90" width="180" height="50" rx="14" fill="#ff4f6d"/><text y="44" text-anchor="middle" class="num" font-size="50" fill="#14301e">JUNE</text></g></g>' +
  '<g id="lb" opacity="0"><rect class="k" x="90" y="1000" width="900" height="380" rx="24" fill="#0a1c10" stroke="#7dff9a" stroke-width="6"/>' +
  '<text x="140" y="1080" class="num" font-size="50" fill="#7dff9a">DAY ONE</text><text x="140" y="1160" class="lbl" font-size="48" fill="#e6f5ea">$4,000 in hand</text>' +
  '<text id="gb" x="140" y="1320" class="lbl" font-size="46" fill="#ffd36b" opacity="0">give some back if students fall short</text>' +
  '<g transform="translate(820,1170)"><g id="c2"><use href="#cash"/></g></g></g>');
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
tl.fromTo("#la", { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, V[3]);
tl.fromTo("#lb", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, V[4]);
tl.fromTo("#c2", { y: -300, rotation: 20 }, { y: 0, rotation: 0, duration: 0.5, ease: "bounce.out", immediateRender: false }, V[4] + 0.3);
K.pop(tl, "#gb", V[4] + 2.0, 0.5);
tl.to("#c2", { x: 40, duration: 0.06, repeat: 7, yoyo: true, ease: "none" }, V[4] + 2.3);

// ---------- S3: same money for the same results; math: +1.9 vs +6.8 percentile points ----------
K.add("#s3", '<g transform="translate(540,560)"><g id="eq" opacity="0"><rect class="k" x="-380" y="-60" width="760" height="120" rx="60" fill="#fff6e0" stroke-width="7"/><text y="18" text-anchor="middle" class="lbl" font-size="52" fill="#14301e">same money, same results</text></g></g>' +
  '<text x="540" y="720" text-anchor="middle" class="lbl" font-size="50" fill="#e6f5ea">math gain, percentile points</text>' +
  '<line x1="160" y1="1300" x2="920" y2="1300" stroke="#e6f5ea" stroke-width="6"/>' +
  '<rect class="k" id="g1" x="200" y="' + (1300 - 1.9 * 60) + '" width="240" height="' + 1.9 * 60 + '" fill="#9aa69c" stroke-width="8"/>' +
  '<rect class="k" id="g2" x="640" y="' + (1300 - 6.8 * 60) + '" width="240" height="' + 6.8 * 60 + '" fill="#7dff9a" stroke-width="8"/>' +
  '<text id="v1" x="320" y="' + (1300 - 1.9 * 60 - 26) + '" text-anchor="middle" class="num" font-size="64" fill="#fff" opacity="0">+1.9</text>' +
  '<text id="v2" x="760" y="' + (1300 - 6.8 * 60 - 26) + '" text-anchor="middle" class="num" font-size="64" fill="#fff" opacity="0">+6.8</text>' +
  '<g class="lbl" font-size="48" fill="#e6f5ea"><text x="320" y="1370" text-anchor="middle">end of year</text><text x="760" y="1370" text-anchor="middle">up front</text></g>');
K.cut(tl, "#s2", "#s3", V[5] - 0.3);
K.pop(tl, "#eq", V[5] + 0.1, 0.5);
tl.set(["#g1", "#g2"], { scaleY: 0, svgOrigin: "0 1300" }, 0);
tl.fromTo("#g1", { scaleY: 0, svgOrigin: "320 1300" }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, V[6] + 0.3);
K.pop(tl, "#v1", V[6] + 0.7, 0.5);
tl.fromTo("#g2", { scaleY: 0, svgOrigin: "760 1300" }, { scaleY: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, V[7] + 0.4);
K.pop(tl, "#v2", V[7] + 1.0, 1.8);
K.camera(tl, "#cam", [[V[7] + 1.0, 1.06, -30, 0, 0.3], [V[8] - 0.4, 1, 0, 0, 0.3]]);

// ---------- S4: payoff + loop — a hand reaches for the cash, the teacher holds on ----------
K.add("#s4", K.person("tch2", "friend", { x: 380, y: 1040, s: 0.42 }) +
  '<g transform="translate(380,1360)"><g id="c4"><use href="#cash"/></g></g>' +
  '<g transform="translate(900,1360)"><g id="hand"><rect class="k" x="-40" y="-36" width="260" height="72" rx="30" fill="#c98f6b" stroke-width="7"/><rect class="k" x="-80" y="-40" width="80" height="80" rx="30" fill="#c98f6b" stroke-width="7"/></g></g>');
K.cut(tl, "#s3", "#s4", V[8] - 0.3);
tl.fromTo("#hand", { x: 300 }, { x: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, V[8] + 0.2);
K.face(tl, "tch2", { m: "frown", br: 14, sweat: 1, look: [40, 30] }, V[8] + 0.5);
tl.to("#c4", { x: -60, duration: 0.3, ease: "back.out(2)" }, V[8] + 0.7);
K.react(tl, "tch2", V[8] + 0.7);
K.words("#t4", "losing it <b>hurts</b> more"); K.title(tl, "#t4", V[8]);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[9] - 0.2);
tl.to("#hand", { x: 300, duration: 0.4, ease: "power2.in" }, V[9] + 0.2);
K.face(tl, "tch2", { m: "smile", e: "h", br: 0, sweat: 0, blush: 0.8, look: [0, -20] }, V[9] + 0.6);
K.react(tl, "tch2", V[9] + 0.6);
K.words("#t5", "<b>$4,000</b> up front <b>worked</b>"); K.title(tl, "#t5", V[9]);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
