<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #1a1f3d; }
  .t { top: 220px; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="34" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85"><stop offset="0" stop-color="#4a56a8"/><stop offset="1" stop-color="#0c0f24"/></radialGradient>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="34"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;
function row(i, name, w, col) {
  return '<g class="row" transform="translate(0,' + (i * 62) + ')"><text x="-230" y="12" class="lbl" font-size="38" fill="#0c0f24">' + name + '</text>' +
    '<rect x="-40" y="-16" width="' + w + '" height="32" rx="8" fill="' + col + '"/></g>';
}

// ---------- S1: HOOK — laptop with the team's pay list; kid (low bar) sinks, coworker (high bar) shrugs ----------
K.add("#s1", '<g transform="translate(540,700)"><g id="lap"><rect class="k" x="-300" y="-170" width="600" height="340" rx="22" fill="#f4f1ff" stroke-width="9"/>' +
  '<text x="0" y="-115" text-anchor="middle" class="num" font-size="40" fill="#4a56a8">TEAM PAY</text>' +
  '<g transform="translate(0,-50)">' + row(0, "Sam", 250, "#7dff9a") + row(1, "Ana", 210, "#7dff9a") + row(2, "YOU", 110, "#ff4f6d") + '</g></g></g>' +
  K.person("kid", "kid", { x: 330, y: 1180, s: 0.36 }) + K.person("cw", "neighbor", { x: 760, y: 1180, s: 0.36, flip: true }));
K.show(tl, "#s1", 0);
K.hook(tl, "#t1", "they saw coworkers' pay. <b>half</b> got <b>sadder.</b>", V[1] - 0.2);
tl.fromTo("#lap", { y: 120, scale: 0.8, svgOrigin: "0 0" }, { y: 0, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0);
tl.fromTo("#s1 .row rect", { scaleX: 0, svgOrigin: "-40 0" }, { scaleX: 1, duration: 0.4, stagger: 0.12, ease: "expo.out" }, 0.1);
K.face(tl, "kid", { m: "frown", br: -14, sweat: 1, look: [20, -30] }, 0.5);
K.react(tl, "kid", 0.6);
K.face(tl, "cw", { m: "flat", look: [-20, -30] }, 0.5);
K.words("#t2", "would you <b>click?</b>"); K.title(tl, "#t2", V[1]);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[2] - 0.2);

// ---------- S2: 2008 salary site; emails to random UC staff; use 19% -> 48%; own department ----------
K.add("#s2", '<g transform="translate(540,500)"><g id="site"><rect class="k" x="-380" y="-70" width="760" height="140" rx="18" fill="#fff6e0" stroke-width="8"/>' +
  '<text y="-8" text-anchor="middle" class="num" font-size="46" fill="#1a1f3d">EVERY STATE SALARY</text><text y="44" text-anchor="middle" class="lbl" font-size="38" fill="#4a56a8">online · California · 2008</text></g></g>' +
  '<g transform="translate(540,690)"><g id="mail" opacity="0"><rect class="k" x="-90" y="-56" width="180" height="112" rx="10" fill="#ffd36b" stroke-width="7"/><path d="M-90,-56 L0,10 L90,-56" fill="none" stroke="#1a1f3d" stroke-width="7"/></g></g>' +
  '<text id="pct" x="540" y="760" text-anchor="middle" class="num" font-size="80" fill="#7dff9a" opacity="0">19% → 48% used it</text>' +
  '<g transform="translate(540,730)"><g id="own" opacity="0"><rect class="k" x="-400" y="-64" width="800" height="110" rx="55" fill="#0c0f24" stroke="#ffd36b" stroke-width="6"/><text y="10" text-anchor="middle" class="lbl" font-size="50" fill="#ffd36b">most looked up their own team</text></g></g>');
K.grid("#s2", "pp", 225, 830, 10, 70, 24, "#5c6aa8");
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
K.pop(tl, "#site", V[2] + 0.1, 0.5);
tl.fromTo("#mail", { opacity: 1, x: -500, rotation: -25 }, { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: "back.out(2)", immediateRender: false }, V[3]);
tl.to("#mail", { y: 300, scale: 0.4, opacity: 0, svgOrigin: "0 0", duration: 0.4, ease: "power2.in" }, V[3] + 1.6);
K.fillGrid(tl, "pp", 19, "#7dff9a", V[4], 0.6);
K.fillGrid(tl, "pp", 48, "#7dff9a", V[4] + 1.2, 1.0);
K.pop(tl, "#pct", V[4] + 0.3, 1.4);
tl.to("#pct", { opacity: 0, duration: 0.2 }, V[5] + 0.0);
K.pop(tl, "#own", V[5] + 0.2, 0.5);

// ---------- S3: twist — below median: less satisfied, job hunting; above: no happier ----------
K.add("#s3", '<text id="n6" x="540" y="520" text-anchor="middle" class="num" font-size="70" fill="#fff">over 6,000 surveyed</text>' +
  '<line x1="540" y1="640" x2="540" y2="1440" stroke="#f4f1ff" stroke-width="5" stroke-dasharray="18 14"/>' +
  '<g class="lbl" font-size="50" fill="#d6dcff"><text x="290" y="650" text-anchor="middle">below median</text><text x="790" y="650" text-anchor="middle">above median</text></g>' +
  K.person("kid2", "kid", { x: 290, y: 980, s: 0.33 }) + K.person("cw2", "neighbor", { x: 790, y: 980, s: 0.33, flip: true }) +
  '<g id="lo" opacity="0"><text x="290" y="1300" text-anchor="middle" class="num" font-size="54" fill="#ff4f6d">less satisfied</text><text x="290" y="1380" text-anchor="middle" class="num" font-size="54" fill="#ffd36b">job hunting ↑</text></g>' +
  '<g id="hi" opacity="0"><text x="790" y="1300" text-anchor="middle" class="num" font-size="54" fill="#d6dcff">no happier</text></g>');
K.cut(tl, "#s2", "#s3", V[6] - 0.3);
K.face(tl, "kid2", { m: "flat" }, V[6]);
K.face(tl, "cw2", { m: "flat" }, V[6]);
K.face(tl, "kid2", { m: "frown", br: -14, sweat: 1 }, V[6] + 2.6);
K.react(tl, "kid2", V[6] + 2.6);
K.pop(tl, "#lo", V[6] + 2.8, 1.8);
K.camera(tl, "#cam", [[V[6] + 2.8, 1.06, 30, 0, 0.3], [V[7] - 0.2, 1, 0, 0, 0.4]]);
K.face(tl, "cw2", { m: "flat", look: [-30, 0] }, V[7] + 0.3);
K.pop(tl, "#hi", V[7] + 0.4, 1.4);

// ---------- S4: the gap only pulls one way; loop ----------
K.add("#s4", '<g transform="translate(540,900)"><g id="beam"><rect class="k" x="-380" y="-16" width="760" height="32" rx="16" fill="#c9ced8" stroke-width="7"/>' +
  '<g transform="translate(-300,-16)"><rect class="k" x="-110" y="-110" width="220" height="110" rx="12" fill="#ff4f6d" stroke-width="7"/><text y="-42" text-anchor="middle" class="num" font-size="44" fill="#fff">sadder</text></g>' +
  '<g transform="translate(300,-16)"><rect class="k" x="-110" y="-110" width="220" height="110" rx="12" fill="#5c6aa8" stroke-width="7"/><text y="-42" text-anchor="middle" class="num" font-size="44" fill="#fff">same</text></g></g>' +
  '<path class="k" d="M-60,110 L0,16 L60,110 Z" fill="#8a8f9c" stroke-width="7"/></g>' +
  K.person("kid3", "kid", { x: 540, y: 1250, s: 0.3 }));
K.cut(tl, "#s3", "#s4", V[8] - 0.3);
tl.fromTo("#beam", { rotation: 0, svgOrigin: "0 0" }, { rotation: -14, duration: 0.8, ease: "elastic.out(1, 0.5)", immediateRender: false }, V[8] + 0.3);
K.words("#t4", "the gap pulls <b>one way</b>"); K.title(tl, "#t4", V[8]);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[9] - 0.2);
K.face(tl, "kid3", { m: "flat", look: [-40, -30] }, V[8] + 0.4);
K.face(tl, "kid3", { m: "smile", look: [0, 0], blush: 0.6 }, V[9] + 0.6);
K.react(tl, "kid3", V[9] + 0.6);
K.words("#t5", "half <b>sadder.</b> half: no cheer."); K.title(tl, "#t5", V[9]);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
