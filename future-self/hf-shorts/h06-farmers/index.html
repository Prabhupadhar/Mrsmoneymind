<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #2a3d12; }
  .t { top: 220px; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="35" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85"><stop offset="0" stop-color="#7aa83a"/><stop offset="1" stop-color="#1f2e0c"/></radialGradient>
      <g id="sack"><path class="k" d="M-80,-110 C-60,-130 60,-130 80,-110 L100,110 C60,130 -60,130 -100,110 Z" fill="#e9dcc0" stroke-width="8"/><path class="k" d="M-50,-118 L50,-118" stroke-width="10"/>
        <text y="20" text-anchor="middle" class="num" font-size="34" fill="#6b4a14">FERT.</text></g>
      <g id="sprout"><path d="M0,0 L0,-90" stroke="#2f8a52" stroke-width="10" stroke-linecap="round"/><path class="k" d="M0,-60 C-60,-90 -70,-40 -10,-50 Z" fill="#3fae6a" stroke-width="5"/><path class="k" d="M0,-80 C60,-120 80,-60 10,-70 Z" fill="#3fae6a" stroke-width="5"/></g>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
      <g id="s5" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t6" class="cap t clip" data-start="0" data-duration="35"></div>
  <div id="t7" class="cap t clip" data-start="0" data-duration="35"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;

// ---------- S1: HOOK — 98% planned (thought bubble), 37% did (sack) ----------
K.add("#s1", K.person("fa", "friend", { x: 540, y: 1120, s: 0.5 }) +
  '<text id="n98" x="250" y="640" text-anchor="middle" class="num" font-size="150" fill="#c8ffd9">98%</text><text x="250" y="720" text-anchor="middle" class="lbl" font-size="60" fill="#e8f5d0">planned it</text>' +
  '<text id="n37" x="830" y="640" text-anchor="middle" class="num" font-size="150" fill="#ff9a8c">37%</text><text x="830" y="720" text-anchor="middle" class="lbl" font-size="60" fill="#e8f5d0">did it</text>' +
  '<g transform="translate(830,1300)"><g id="sk1"><use href="#sack"/></g></g>' +
  '<g transform="translate(250,1300)"><g id="bub"><ellipse class="k" rx="150" ry="100" fill="#fff" stroke-width="8"/><text y="-10" text-anchor="middle" class="lbl" font-size="50" fill="#2a3d12">next season</text><text y="45" text-anchor="middle" class="lbl" font-size="50" fill="#2a3d12">I\'ll buy it!</text></g></g>');
K.show(tl, "#s1", 0);
K.hook(tl, "#t1", "<b>98%</b> planned it. <b>37%</b> did it.", V[1] - 0.2);
tl.fromTo(["#n98", "#n37"], { scale: 1.25, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, stagger: 0.15, ease: "back.out(2.5)" }, 0);
tl.fromTo("#bub", { scale: 0.2, svgOrigin: "0 0" }, { scale: 1, duration: 0.5, ease: "back.out(2.5)" }, 0);
tl.fromTo("#sk1", { y: -500, rotation: -20 }, { y: 0, rotation: 0, duration: 0.6, ease: "bounce.out" }, 0.6);
K.face(tl, "fa", { m: "smile", look: [-40, -20] }, 0);
K.face(tl, "fa", { m: "o", br: 14, look: [40, 10], sweat: 1 }, 1.3);
K.react(tl, "fa", 1.3);
K.words("#t2", "your savings <b>plan?</b>"); K.title(tl, "#t2", V[1] + 0.1);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[2] - 0.2);

// ---------- S2: Western Kenya, fertilizer pays ~36% a season ----------
K.add("#s2", '<rect x="0" y="1180" width="1080" height="320" fill="#6b4a1e"/>' +
  [0, 1, 2, 3, 4, 5].map(function (i) { return '<g transform="translate(' + (140 + i * 160) + ',1200)"><g class="spr" id="spr' + i + '"><use href="#sprout"/></g></g>'; }).join("") +
  '<text x="540" y="560" text-anchor="middle" class="lbl" font-size="70" fill="#e8f5d0">western Kenya</text>' +
  '<g transform="translate(540,880)"><g id="sk2"><use href="#sack"/></g></g>' +
  '<text id="r36" x="540" y="1080" text-anchor="middle" class="num" font-size="120" fill="#ffd36b" opacity="0">+36%</text>' +
  '<text id="r36l" x="540" y="1150" text-anchor="middle" class="lbl" font-size="52" fill="#e8f5d0" opacity="0">back in one season</text>');
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
tl.fromTo(".spr", { scaleY: 0, svgOrigin: "0 0" }, { scaleY: 1, duration: 0.5, stagger: 0.1, ease: "back.out(2)", immediateRender: false }, V[2] + 0.2);
K.pop(tl, "#sk2", V[2] + 1.2, 0.3);
K.pop(tl, "#r36", V[2] + 3.4, 1.6);
tl.to("#r36l", { opacity: 1, duration: 0.3 }, V[2] + 3.6);
tl.to(".spr", { scaleY: 1.5, svgOrigin: "0 0", duration: 0.8, stagger: 0.05, ease: "back.out(2)" }, V[2] + 3.4);

// ---------- S3: "next season I'll buy it" ... the money is gone ----------
K.add("#s3", K.person("fa2", "friend", { x: 330, y: 1040, s: 0.5 }) +
  '<g transform="translate(790,820)"><g id="cal"><rect class="k" x="-170" y="-150" width="340" height="300" rx="16" fill="#fff" stroke-width="9"/><rect x="-165" y="-145" width="330" height="80" rx="10" fill="#d8432f"/>' +
  '<text id="calT" y="-88" text-anchor="middle" class="num" font-size="44" fill="#fff">HARVEST</text></g></g>' +
  '<text id="calT2" x="790" y="900" text-anchor="middle" class="lbl" font-size="64" fill="#2a3d12">money: ✓</text>' +
  '<g id="coins3">' + [0, 1, 2, 3, 4].map(function (i) { return '<g transform="translate(' + (230 + i * 50) + ',1330)"><g class="c3" id="c3' + i + '"><circle class="k" r="30" fill="#ffd36b" stroke-width="6"/></g></g>'; }).join("") + '</g>');
K.cut(tl, "#s2", "#s3", V[3] - 0.3);
K.face(tl, "fa2", { m: "smile", look: [40, -10] }, V[3]);
K.words("#t3", "<b>next</b> season..."); K.title(tl, "#t3", V[3]);
tl.to("#t3", { opacity: 0, duration: 0.2 }, V[4] - 0.2);
// months flip to planting; coins drain away
tl.to("#cal", { scaleY: 0, svgOrigin: "0 -150", duration: 0.15, ease: "power2.in" }, V[4]);
tl.call(function () {}, [], V[4] + 0.15);
tl.set("#calT", { textContent: "PLANTING" }, V[4] + 0.15);
tl.set("#calT2", { textContent: "money: ✗" }, V[4] + 0.15);
tl.to("#cal", { scaleY: 1, svgOrigin: "0 -150", duration: 0.25, ease: "back.out(2)" }, V[4] + 0.15);
tl.to(".c3", { y: 500, opacity: 0, rotation: 90, duration: 0.6, stagger: 0.12, ease: "power2.in" }, V[4] + 0.5);
K.face(tl, "fa2", { m: "frown", br: 16, look: [0, 30], sweat: 1 }, V[4] + 0.8);

// ---------- S4: free delivery right after harvest -> use +11 points ----------
K.add("#s4", K.person("off", "boss", { x: 270, y: 900, s: 0.38 }) +
  '<g transform="translate(700,830)"><g id="vou"><rect class="k" x="-230" y="-120" width="460" height="240" rx="18" fill="#fff6e0" stroke-width="9"/>' +
  '<text y="-40" text-anchor="middle" class="num" font-size="44" fill="#1d2a6b">VOUCHER</text><text y="20" text-anchor="middle" class="lbl" font-size="50" fill="#1d2a6b">normal price</text>' +
  '<text y="80" text-anchor="middle" class="lbl" font-size="50" fill="#2f8a52">free delivery</text></g></g>' +
  '<line x1="160" y1="1430" x2="920" y2="1430" stroke="#e8f5d0" stroke-width="6"/>' +
  '<rect class="k" id="cb" x="220" y="' + (1430 - 34 * 8) + '" width="240" height="' + 34 * 8 + '" fill="#a9b39a" stroke-width="8"/>' +
  '<rect class="k" id="sb" x="620" y="' + (1430 - 45 * 8) + '" width="240" height="' + 45 * 8 + '" fill="#ffd36b" stroke-width="8"/>' +
  '<text x="340" y="' + (1430 - 34 * 8 - 24) + '" text-anchor="middle" class="num" font-size="64" fill="#fff">34%</text>' +
  '<text id="p45" x="740" y="' + (1430 - 45 * 8 - 24) + '" text-anchor="middle" class="num" font-size="64" fill="#fff" opacity="0">45%</text>' +
  '<text x="340" y="1490" text-anchor="middle" class="lbl" font-size="46" fill="#e8f5d0">no offer</text><text x="740" y="1490" text-anchor="middle" class="lbl" font-size="46" fill="#e8f5d0">offer at harvest</text>');
K.cut(tl, "#s3", "#s4", V[5] - 0.3);
K.words("#t4", "right after <b>harvest</b>"); K.title(tl, "#t4", V[5]);
K.pop(tl, "#vou", V[5] + 1.0, 0.4);
K.face(tl, "off", { m: "smile" }, V[5] + 0.4);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[6] - 0.2);
tl.fromTo("#cb", { scaleY: 0, svgOrigin: "340 1430" }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, V[6]);
tl.fromTo("#sb", { scaleY: 0, svgOrigin: "740 1430" }, { scaleY: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, V[6] + 0.2);
K.pop(tl, "#p45", V[6] + 0.8, 1.6);
K.words("#t5", "use <b>+11</b> points"); K.title(tl, "#t5", V[6] + 0.3);
tl.to("#t5", { opacity: 0, duration: 0.2 }, V[7] - 0.2);

// ---------- S5: same offer later: about half as many buyers; loop ----------
K.add("#s5", '<g id="chart5"><text x="540" y="520" text-anchor="middle" class="lbl" font-size="60" fill="#e8f5d0">who bought, same free delivery:</text>' +
  '<line x1="160" y1="1300" x2="920" y2="1300" stroke="#e8f5d0" stroke-width="6"/>' +
  '<rect class="k" id="eb" x="220" y="' + (1300 - 39 * 14) + '" width="240" height="' + 39 * 14 + '" fill="#ffd36b" stroke-width="8"/>' +
  '<rect class="k" id="lb" x="620" y="' + (1300 - 20 * 14) + '" width="240" height="' + 20 * 14 + '" fill="#ff9a8c" stroke-width="8"/>' +
  '<text x="340" y="' + (1300 - 39 * 14 - 24) + '" text-anchor="middle" class="num" font-size="70" fill="#fff">39%</text>' +
  '<text id="p20" x="740" y="' + (1300 - 20 * 14 - 24) + '" text-anchor="middle" class="num" font-size="70" fill="#fff" opacity="0">20%</text>' +
  '<text x="340" y="1370" text-anchor="middle" class="lbl" font-size="50" fill="#e8f5d0">at harvest</text><text x="740" y="1370" text-anchor="middle" class="lbl" font-size="50" fill="#e8f5d0">months later</text></g>' +
  '<g id="end" opacity="0">' + K.person("fa3", "friend", { x: 540, y: 1000, s: 0.45 }) + '<g transform="translate(540,1300)"><g id="sk3"><use href="#sack"/></g></g></g>');
K.cut(tl, "#s4", "#s5", V[7] - 0.3);
tl.fromTo("#eb", { scaleY: 0, svgOrigin: "340 1300" }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, V[7] + 0.1);
tl.fromTo("#lb", { scaleY: 0, svgOrigin: "740 1300" }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, V[8]);
K.pop(tl, "#p20", V[8] + 0.3, 1.8);
K.words("#t6", "about <b>half</b> as many"); K.title(tl, "#t6", V[8] + 0.1);
K.camera(tl, "#cam", [[V[8], 1.07, -30, 0, 0.3], [V[9] - 0.3, 1, 0, 0, 0.5]]);
tl.to("#t6", { opacity: 0, duration: 0.2 }, V[9] - 0.2);
tl.to("#chart5", { opacity: 0, duration: 0.3 }, V[9]);
tl.fromTo("#end", { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, V[9] + 0.1);
K.face(tl, "fa3", { m: "smile", e: "h", blush: 0.8 }, V[9] + 0.6);
K.react(tl, "fa3", V[9] + 0.6);
K.words("#t7", "decide while the money's <b>in hand</b>");
tl.set("#t7", { opacity: 0 }, 0);
tl.set("#t7", { opacity: 1 }, V[9]);
tl.fromTo("#t7 span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.08, immediateRender: false }, V[9]);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
