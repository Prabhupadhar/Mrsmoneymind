<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #3a2208; }
  .t { top: 220px; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="33" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="33" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85"><stop offset="0" stop-color="#b86a1e"/><stop offset="1" stop-color="#200f02"/></radialGradient>
      <g id="plate"><ellipse class="k" rx="200" ry="80" fill="#fff" stroke-width="8"/><ellipse rx="140" ry="52" fill="none" stroke="#e6e0d6" stroke-width="6"/></g>
      <g id="food"><circle cx="-70" cy="-30" r="44" fill="#ff7a5c"/><circle cx="10" cy="-44" r="50" fill="#ffd36b"/><circle cx="80" cy="-24" r="40" fill="#7dd88f"/><rect x="-40" y="-40" width="90" height="34" rx="16" fill="#c98b2c"/></g>
      <g id="cal"><rect class="k" x="-120" y="-120" width="240" height="240" rx="18" fill="#fff6e0" stroke-width="8"/><rect x="-120" y="-120" width="240" height="66" rx="18" fill="#ff4f6d"/></g>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
      <g id="s5" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="33"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="33"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="33"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="33"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="33"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;

// ---------- S1: HOOK — calendar flips DAY 1 -> DAY 30 while the plate empties; kid's face falls ----------
K.add("#s1", '<g transform="translate(780,700)"><g id="c1"><use href="#cal"/><text id="dn" y="60" text-anchor="middle" class="num" font-size="54" fill="#3a2208">DAY 1</text></g></g>' +
  '<g transform="translate(400,1060)"><use href="#plate"/><g transform="translate(0,-10)"><g id="f1"><use href="#food"/></g></g></g>' +
  K.person("kid", "kid", { x: 300, y: 1300, s: 0.3 }) +
  '<text id="m15" x="780" y="960" text-anchor="middle" class="num" font-size="80" fill="#ff7a5c" opacity="0">up to −15%</text>');
K.show(tl, "#s1", 0);
K.hook(tl, "#t1", "money day: full plates. day 30: up to <b>−15%.</b>", V[1] - 0.2);
tl.fromTo("#c1", { y: -80, rotation: 8 }, { y: 0, rotation: 0, duration: 0.45, ease: "bounce.out" }, 0);
tl.fromTo("#f1", { scale: 1.15, svgOrigin: "0 0" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0);
K.face(tl, "kid", { m: "smile", e: "h", blush: 0.7, look: [20, -40] }, 0);
[7, 14, 21, 30].forEach(function (d, i) { tl.set("#dn", { textContent: "DAY " + d }, 0.8 + i * 0.35); });
tl.to("#f1", { scale: 0.85, svgOrigin: "0 0", duration: 1.4, ease: "power1.in" }, 0.8);
K.face(tl, "kid", { m: "frown", e: "n", blush: 0, br: 12, look: [20, -40] }, 2.0);
K.react(tl, "kid", 2.0);
K.pop(tl, "#m15", 2.2, 0.5);
K.words("#t2", "the end-of-month <b>squeeze?</b>"); K.title(tl, "#t2", V[1]);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[2] - 0.2);

// ---------- S2: food diaries, US families on food stamps; benefit on the same day every month ----------
K.add("#s2", '<g transform="translate(540,640)"><g id="diary"><rect class="k" x="-240" y="-140" width="480" height="280" rx="16" fill="#fff6e0" stroke-width="8"/><rect x="-240" y="-140" width="40" height="280" rx="12" fill="#c98b2c"/>' +
  '<text x="20" y="-50" text-anchor="middle" class="num" font-size="50" fill="#3a2208">FOOD DIARY</text>' +
  '<rect x="-150" y="0" width="300" height="14" rx="6" fill="#d9c9b0"/><rect x="-150" y="40" width="240" height="14" rx="6" fill="#d9c9b0"/><rect x="-150" y="80" width="270" height="14" rx="6" fill="#d9c9b0"/></g></g>' +
  '<text x="540" y="880" text-anchor="middle" class="lbl" font-size="52" fill="#ffe6c9">US families on food stamps</text>' +
  [0, 1, 2].map(function (i) { return '<g transform="translate(' + (250 + i * 290) + ',1200)"><g class="mo" opacity="0"><use href="#cal"/><text y="50" text-anchor="middle" class="num" font-size="52" fill="#3a2208">DAY 1</text></g></g>'; }).join("") +
  '<text id="same" x="540" y="1420" text-anchor="middle" class="lbl" font-size="52" fill="#ffd36b" opacity="0">same day, every month</text>');
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
K.pop(tl, "#diary", V[2] + 0.1, 0.5);
tl.fromTo(".mo", { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.2, ease: "back.out(2)", immediateRender: false }, V[3]);
K.pop(tl, "#same", V[3] + 1.2, 0.5);

// ---------- S3: calories fall a little every day: 10-15% over the month ----------
(function () {
  var x0 = 170, x1 = 910, yTop = 760, ySpan = 1300 - 760, pts = [];
  for (var d = 0; d <= 30; d++) { var v = 1 - 0.0042 * d; pts.push((x0 + (x1 - x0) * d / 30).toFixed(1) + "," + (yTop + (1 - v) * ySpan * 3).toFixed(1)); }
  K.add("#s3", '<text x="540" y="560" text-anchor="middle" class="lbl" font-size="56" fill="#ffe6c9">calories eaten, day by day</text>' +
    '<line x1="170" y1="1300" x2="910" y2="1300" stroke="#ffe6c9" stroke-width="6"/><line x1="170" y1="700" x2="170" y2="1300" stroke="#ffe6c9" stroke-width="6"/>' +
    '<polyline id="ln" points="' + pts.join(" ") + '" fill="none" stroke="#ffd36b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<g class="lbl" font-size="46" fill="#ffe6c9"><text x="170" y="1360" text-anchor="middle">day 1</text><text x="910" y="1360" text-anchor="middle">day 30</text></g>' +
    '<text id="drop" x="700" y="740" text-anchor="middle" class="num" font-size="70" fill="#ff7a5c" opacity="0">−10 to 15%</text>');
})();
K.cut(tl, "#s2", "#s3", V[4] - 0.3);
tl.fromTo("#ln", { strokeDasharray: 1200, strokeDashoffset: 1200 }, { strokeDashoffset: 0, duration: 2.2, ease: "none", immediateRender: false }, V[4] + 0.3);
K.pop(tl, "#drop", V[4] + 2.8, 1.6);
K.camera(tl, "#cam", [[V[4] + 2.8, 1.05, -30, 20, 0.3], [V[5] - 0.3, 1, 0, 0, 0.3]]);

// ---------- S4: twist — week 4: more would take < $50 now over $50 next month ----------
K.add("#s4", '<g transform="translate(290,720)"><g id="now"><rect class="k" x="-200" y="-110" width="400" height="220" rx="20" fill="#7dd88f" stroke-width="8"/><text y="0" text-anchor="middle" class="num" font-size="64" fill="#1d5a32">&lt; $50</text><text y="64" text-anchor="middle" class="lbl" font-size="46" fill="#1d5a32">today</text></g></g>' +
  '<g transform="translate(790,720)"><g id="later"><rect class="k" x="-200" y="-110" width="400" height="220" rx="20" fill="#c9ced8" stroke-width="8"/><text y="0" text-anchor="middle" class="num" font-size="64" fill="#2b2f45">$50</text><text y="64" text-anchor="middle" class="lbl" font-size="46" fill="#2b2f45">next month</text></g></g>' +
  '<text x="540" y="740" text-anchor="middle" class="num" font-size="56" fill="#fff">or</text>' +
  '<line x1="200" y1="1300" x2="880" y2="1300" stroke="#ffe6c9" stroke-width="6"/>' +
  '<rect class="k" id="w1" x="250" y="1150" width="220" height="150" fill="#9aa69c" stroke-width="7"/><rect class="k" id="w4" x="610" y="1110" width="220" height="190" fill="#ff7a5c" stroke-width="7"/>' +
  '<g class="lbl" font-size="48" fill="#ffe6c9"><text x="360" y="1360" text-anchor="middle">week 1</text><text x="720" y="1360" text-anchor="middle">week 4</text></g>' +
  '<text id="p7" x="720" y="1080" text-anchor="middle" class="num" font-size="60" fill="#fff" opacity="0">+7 pts</text>' +
  '<text x="540" y="960" text-anchor="middle" class="lbl" font-size="48" fill="#ffe6c9">pick “less, today”</text>');
K.cut(tl, "#s3", "#s4", V[5] - 0.3);
tl.set(["#w1", "#w4"], { scaleY: 0, svgOrigin: "0 1300" }, 0);
tl.fromTo("#w1", { scaleY: 0, svgOrigin: "360 1300" }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, V[5] + 1.6);
tl.fromTo("#w4", { scaleY: 0, svgOrigin: "720 1300" }, { scaleY: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, V[5] + 2.6);
K.pop(tl, "#p7", V[5] + 3.2, 1.6);
tl.to("#now", { scale: 1.08, svgOrigin: "0 0", duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, V[5] + 3.4);

// ---------- S5: payoff + loop — split by week; day 30 gets a full plate ----------
K.add("#s5", [1, 2, 3, 4].map(function (w, i) {
    return '<g transform="translate(' + (195 + i * 230) + ',760)"><g class="jar"><path class="k" d="M-80,-100 L80,-100 L72,100 C70,116 -70,116 -72,100 Z" fill="#ffffff" fill-opacity="0.18" stroke="#ffe6c9" stroke-width="7"/>' +
      '<rect x="-60" y="10" width="120" height="80" rx="10" fill="#7dd88f"/><text y="-40" text-anchor="middle" class="num" font-size="40" fill="#ffe6c9">WK ' + w + '</text></g></g>';
  }).join("") +
  '<g transform="translate(560,1180)"><use href="#plate"/><g transform="translate(0,-10)"><use href="#food"/></g></g>' +
  '<g transform="translate(900,1180)"><g id="c5"><use href="#cal"/><text y="60" text-anchor="middle" class="num" font-size="50" fill="#3a2208">DAY 30</text></g></g>' +
  K.person("kid2", "kid", { x: 250, y: 1220, s: 0.28 }));
K.cut(tl, "#s4", "#s5", V[6] - 0.3);
tl.fromTo(".jar", { y: -300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.12, ease: "bounce.out", immediateRender: false }, V[6] + 0.1);
K.words("#t4", "week 1 feels more <b>urgent</b>"); K.title(tl, "#t4", V[6]);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[7] - 0.2);
K.face(tl, "kid2", { m: "flat", look: [40, -20] }, V[6]);
K.face(tl, "kid2", { m: "smile", e: "h", blush: 0.8, look: [40, 0] }, V[7] + 1.0);
K.react(tl, "kid2", V[7] + 1.0);
K.pop(tl, "#c5", V[7] + 0.8, 0.5);
K.words("#t5", "day 30 gets a <b>full plate</b>"); K.title(tl, "#t5", V[7]);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
