<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #0d2a2e; }
  .t { top: 220px; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="31" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="31" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85"><stop offset="0" stop-color="#2a8a8a"/><stop offset="1" stop-color="#061618"/></radialGradient>
      <g id="page"><rect class="k" x="-120" y="-160" width="240" height="320" rx="10" fill="#fff" stroke-width="7"/>
        <rect x="-90" y="-120" width="180" height="16" rx="6" fill="#c9ced8"/><rect x="-90" y="-80" width="140" height="16" rx="6" fill="#c9ced8"/><rect x="-90" y="-40" width="170" height="16" rx="6" fill="#c9ced8"/><rect x="-90" y="0" width="120" height="16" rx="6" fill="#c9ced8"/><rect x="-90" y="40" width="160" height="16" rx="6" fill="#c9ced8"/><rect x="-90" y="80" width="100" height="16" rx="6" fill="#c9ced8"/></g>
      <g id="uni"><path class="k" d="M-170,-60 L0,-150 L170,-60 Z" fill="#ffd36b" stroke-width="8"/><rect class="k" x="-160" y="-60" width="320" height="30" fill="#fff6e0" stroke-width="7"/>
        <rect class="k" x="-140" y="-30" width="40" height="150" fill="#fff6e0" stroke-width="6"/><rect class="k" x="-60" y="-30" width="40" height="150" fill="#fff6e0" stroke-width="6"/><rect class="k" x="20" y="-30" width="40" height="150" fill="#fff6e0" stroke-width="6"/><rect class="k" x="100" y="-30" width="40" height="150" fill="#fff6e0" stroke-width="6"/>
        <rect class="k" x="-180" y="120" width="360" height="30" fill="#fff6e0" stroke-width="7"/></g>
      <g id="watch"><circle class="k" r="110" fill="#fff6e0" stroke-width="9"/><rect class="k" x="-22" y="-150" width="44" height="34" rx="8" fill="#ff4f6d" stroke-width="6"/></g>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
      <g id="s5" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="31"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="31"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="31"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="31"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="31"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;

// ---------- S1: HOOK — stopwatch sweeps, kid runs toward the college; then the 8-page form drops in ----------
K.add("#s1", '<g transform="translate(250,700)"><g id="w1"><use href="#watch"/><text y="62" text-anchor="middle" class="num" font-size="40" fill="#0d2a2e">10 min</text>' +
  '<line id="hand" x1="0" y1="0" x2="0" y2="-70" stroke="#ff4f6d" stroke-width="10" stroke-linecap="round"/></g></g>' +
  '<g transform="translate(790,760)"><g id="u1"><use href="#uni"/></g></g>' +
  K.person("kid", "kid", { x: 400, y: 1180, s: 0.38 }) +
  '<g id="pages" opacity="0">' + [0, 1, 2, 3, 4, 5, 6, 7].map(function (i) {
    return '<g transform="translate(' + (300 + i * 70) + ',' + (1000 - i * 12) + ') rotate(' + (i * 4 - 14) + ')"><g class="pg"><use href="#page"/></g></g>';
  }).join("") + '</g>');
K.show(tl, "#s1", 0);
K.hook(tl, "#t1", "10 minutes of help. more kids in <b>college.</b>", V[1] - 0.2);
tl.fromTo("#hand", { rotation: 0, svgOrigin: "0 0" }, { rotation: 360, duration: 1.6, ease: "none" }, 0);
tl.fromTo("#u1", { y: 120, scale: 0.7, svgOrigin: "0 0" }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 0);
tl.fromTo("#kid", { x: -120 }, { x: 0, duration: 0.6, ease: "power2.out" }, 0);
K.face(tl, "kid", { m: "smile", e: "h", blush: 0.8, look: [40, -20] }, 0.5);
K.react(tl, "kid", 0.6);
tl.to(["#w1", "#u1", "#kid"], { opacity: 0, duration: 0.25 }, V[1] - 0.1);
tl.set("#pages", { opacity: 1 }, V[1]);
tl.fromTo(".pg", { y: -900 }, { y: 0, duration: 0.4, stagger: 0.12, ease: "bounce.out", immediateRender: false }, V[1]);
K.words("#t2", "8 pages. <b>100+</b> questions."); K.title(tl, "#t2", V[1]);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[2] - 0.2);

// ---------- S2: 2008 tax offices; the tax return pre-fills the aid form; the rest under 10 minutes ----------
K.add("#s2", '<text x="540" y="520" text-anchor="middle" class="num" font-size="66" fill="#fff">TAX OFFICE · 2008</text>' +
  '<text x="540" y="590" text-anchor="middle" class="lbl" font-size="48" fill="#cdeeee">Ohio · North Carolina</text>' +
  '<g transform="translate(260,920)"><g id="tax"><use href="#page"/><text y="-130" text-anchor="middle" class="num" font-size="34" fill="#0d2a2e">TAXES</text></g></g>' +
  '<g transform="translate(540,920)"><g id="arw" opacity="0"><path d="M-80,0 L60,0 M10,-46 L66,0 L10,46" fill="none" stroke="#ffd36b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g></g>' +
  '<g transform="translate(820,920)"><g id="aid"><rect class="k" x="-120" y="-160" width="240" height="320" rx="10" fill="#fff" stroke-width="7"/><text y="-122" text-anchor="middle" class="num" font-size="34" fill="#0d2a2e">AID FORM</text>' +
  [0, 1, 2, 3, 4, 5].map(function (i) { return '<rect class="fl" x="-90" y="' + (-90 + i * 40) + '" width="180" height="18" rx="6" fill="#3fd17a"/>'; }).join("") + '</g></g>' +
  '<g transform="translate(540,1330)"><g id="w2" opacity="0"><use href="#watch"/><text y="24" text-anchor="middle" class="num" font-size="40" fill="#0d2a2e">&lt; 10 min</text></g></g>');
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
tl.set(".fl", { scaleX: 0, svgOrigin: "-90 0" }, 0);
tl.fromTo(".fl", { scaleX: 0, svgOrigin: "-90 0" }, { scaleX: 1, duration: 0.3, stagger: 0.15, ease: "expo.out", immediateRender: false }, V[3] + 0.6);
tl.fromTo("#arw", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, V[3] + 0.3);
K.pop(tl, "#w2", V[3] + 2.6, 0.5);

// ---------- S3: enrollment 26.8% -> 34.5% ----------
K.add("#s3", '<text x="540" y="540" text-anchor="middle" class="lbl" font-size="58" fill="#cdeeee">teens in college next fall</text>' +
  '<line x1="160" y1="1300" x2="920" y2="1300" stroke="#cdeeee" stroke-width="6"/>' +
  '<rect class="k" id="b1" x="200" y="' + (1300 - 26.8 * 18) + '" width="240" height="' + 26.8 * 18 + '" fill="#8a9aa0" stroke-width="8"/>' +
  '<rect class="k" id="b2" x="640" y="' + (1300 - 34.5 * 18) + '" width="240" height="' + 34.5 * 18 + '" fill="#3fd17a" stroke-width="8"/>' +
  '<text id="v1" x="320" y="' + (1300 - 26.8 * 18 - 26) + '" text-anchor="middle" class="num" font-size="70" fill="#fff" opacity="0">26.8%</text>' +
  '<text id="v2" x="760" y="' + (1300 - 34.5 * 18 - 26) + '" text-anchor="middle" class="num" font-size="70" fill="#fff" opacity="0">34.5%</text>' +
  '<g class="lbl" font-size="50" fill="#cdeeee"><text x="320" y="1370" text-anchor="middle">no help</text><text x="760" y="1370" text-anchor="middle">form help</text></g>');
K.cut(tl, "#s2", "#s3", V[4] - 0.3);
tl.fromTo("#b1", { scaleY: 0, svgOrigin: "320 1300" }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, V[4] + 0.3);
K.pop(tl, "#v1", V[4] + 0.7, 0.6);
tl.fromTo("#b2", { scaleY: 0, svgOrigin: "760 1300" }, { scaleY: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, V[4] + 2.0);
K.pop(tl, "#v2", V[4] + 2.5, 1.6);
K.camera(tl, "#cam", [[V[4] + 2.5, 1.06, -30, 0, 0.3], [V[5] - 0.4, 1, 0, 0, 0.3]]);

// ---------- S4: twist — told the aid amount only: applications flat ----------
K.add("#s4", '<g transform="translate(540,640)"><g id="env"><rect class="k" x="-230" y="-120" width="460" height="240" rx="16" fill="#ffd36b" stroke-width="8"/><path d="M-230,-120 L0,30 L230,-120" fill="none" stroke="#0d2a2e" stroke-width="8"/>' +
  '<text y="96" text-anchor="middle" class="num" font-size="44" fill="#0d2a2e">your aid: $$$</text></g></g>' +
  '<g transform="translate(540,880)"><text text-anchor="middle" class="lbl" font-size="50" fill="#cdeeee">no form help</text></g>' +
  K.person("kid2", "kid", { x: 330, y: 1180, s: 0.36 }) +
  '<g id="flat" opacity="0"><path d="M620,1230 L960,1230" stroke="#ff9a8c" stroke-width="14" stroke-linecap="round"/><text x="790" y="1180" text-anchor="middle" class="num" font-size="58" fill="#ff9a8c">applications</text><text x="790" y="1310" text-anchor="middle" class="num" font-size="58" fill="#ff9a8c">no change</text></g>');
K.cut(tl, "#s3", "#s4", V[5] - 0.3);
tl.fromTo("#env", { y: -200, rotation: -10 }, { y: 0, rotation: 0, duration: 0.5, ease: "back.out(2)", immediateRender: false }, V[5]);
K.face(tl, "kid2", { m: "smile", look: [40, -40] }, V[5] + 0.4);
K.face(tl, "kid2", { m: "o", br: 12, sweat: 1, look: [40, 0] }, V[5] + 3.0);
K.react(tl, "kid2", V[5] + 3.0);
K.pop(tl, "#flat", V[5] + 3.1, 1.6);

// ---------- S5: payoff + loop — the form is a wall; 10 minutes knocks it down ----------
K.add("#s5", K.person("kid3", "kid", { x: 230, y: 1150, s: 0.34 }) +
  '<g transform="translate(540,1050)"><g id="wall">' + [0, 1, 2, 3, 4].map(function (r) {
    return '<rect class="k brick" x="-70" y="' + (-250 + r * 100) + '" width="140" height="96" rx="6" fill="#c9533a" stroke-width="6"/>';
  }).join("") + '<text y="10" text-anchor="middle" class="num" font-size="46" fill="#fff">FORM</text></g></g>' +
  '<g transform="translate(850,1000)"><g id="u5"><use href="#uni"/></g></g>');
K.cut(tl, "#s4", "#s5", V[6] - 0.3);
K.face(tl, "kid3", { m: "flat", look: [40, 0] }, V[6]);
K.words("#t4", "the form was the <b>wall</b>"); K.title(tl, "#t4", V[6]);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[7] - 0.2);
tl.to("#wall", { y: 500, rotation: 30, opacity: 0, svgOrigin: "0 200", duration: 0.7, ease: "power2.in" }, V[7] + 0.3);
tl.to("#kid3", { x: 280, duration: 0.8, ease: "power2.inOut" }, V[7] + 0.8);
K.face(tl, "kid3", { m: "smile", e: "h", blush: 0.8, look: [40, -20] }, V[7] + 0.8);
K.react(tl, "kid3", V[7] + 1.0);
K.words("#t5", "10 minutes. more kids in <b>college.</b>"); K.title(tl, "#t5", V[7]);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
