<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="voice.js"></script>
<script src="kit.js"></script>
<link rel="stylesheet" href="base.css" />
<style>
  #root, html, body { background: #142e1a; }
  .t { top: 220px; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1080" data-height="1920" data-motion-blur="on">
  <svg id="art" class="clip" data-start="0" data-duration="34" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85"><stop offset="0" stop-color="#3e9a5a"/><stop offset="1" stop-color="#0b1f10"/></radialGradient>
      <g id="bottle"><rect class="k" x="-45" y="-130" width="90" height="190" rx="22" fill="#ff9ec4" stroke-width="7"/><rect class="k" x="-22" y="-170" width="44" height="44" rx="8" fill="#fff" stroke-width="6"/><rect x="-30" y="-70" width="60" height="50" rx="6" fill="#fff" opacity="0.7"/></g>
      <g id="tagp"><rect class="k" x="-80" y="-34" width="160" height="68" rx="10" fill="#fff6e0" stroke-width="6"/><text y="14" text-anchor="middle" class="num" font-size="34" fill="#142e1a">PRICE</text></g>
      <g id="tagt"><rect class="k" x="-80" y="-34" width="160" height="68" rx="10" fill="#ffd36b" stroke-width="6"/><text y="13" text-anchor="middle" class="num" font-size="30" fill="#142e1a">+ TAX</text></g>
    </defs>
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <g id="cam">
      <g id="s1" class="scene"></g>
      <g id="s2" class="scene"></g>
      <g id="s3" class="scene"></g>
      <g id="s4" class="scene"></g>
    </g>
  </svg>
  <div id="t1" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t2" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t3" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t4" class="cap t clip" data-start="0" data-duration="34"></div>
  <div id="t5" class="cap t clip" data-start="0" data-duration="34"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true }), V = window.VO;
function shelf(pre, y) {
  var m = '<rect class="k" x="90" y="' + (y + 70) + '" width="900" height="30" rx="8" fill="#8a5a2a" stroke-width="7"/>';
  [0, 1, 2].forEach(function (i) {
    var x = 250 + i * 290;
    m += '<g transform="translate(' + x + ',' + y + ')"><use href="#bottle"/></g>' +
      '<g transform="translate(' + x + ',' + (y + 150) + ')"><use href="#tagp"/></g>' +
      '<g transform="translate(' + x + ',' + (y + 235) + ')"><g class="' + pre + '" opacity="0"><use href="#tagt"/></g></g>';
  });
  return m;
}

// ---------- S1: HOOK — shelf, a "+ TAX" tag slides under each price, sales arrow drops 8% ----------
K.add("#s1", shelf("tt1", 820) + '<g transform="translate(540,1380)"><g id="drop"><path d="M-260,-40 L-60,-40 L-60,-90 L60,10 L-60,110 L-60,60 L-260,60 Z" fill="#ff4f6d" transform="rotate(90) translate(0,0)"/></g></g>' +
  '<text id="m8" x="540" y="1470" text-anchor="middle" class="num" font-size="90" fill="#ff4f6d" opacity="0">−8% sold</text>');
K.show(tl, "#s1", 0);
K.hook(tl, "#t1", "same price. different <b>tag.</b> <b>8%</b> fewer sales.", V[1] - 0.2);
tl.fromTo(".tt1", { opacity: 1, y: 60, scale: 0.6, svgOrigin: "0 0" }, { opacity: 1, y: 0, scale: 1, duration: 0.4, stagger: 0.12, ease: "back.out(2.6)" }, 0);
tl.set("#drop", { opacity: 0 }, 0);
K.pop(tl, "#m8", 0.9, 1.8);
K.words("#t2", "one number you <b>skip</b>"); K.title(tl, "#t2", V[1]);
tl.to("#t2", { opacity: 0, duration: 0.2 }, V[2] - 0.2);

// ---------- S2: the experiment — 1 store, 3 weeks, 750 products; tags added; tax always at the register ----------
K.add("#s2", '<text x="540" y="540" text-anchor="middle" class="lbl" font-size="64" fill="#dff5e4">1 grocery store · 3 weeks · 2006</text>' +
  '<text id="n750" x="540" y="680" text-anchor="middle" class="num" font-size="110" fill="#fff">0</text>' +
  '<text x="540" y="750" text-anchor="middle" class="lbl" font-size="50" fill="#dff5e4">products: cosmetics · hair care · deodorant</text>' +
  shelf("tt2", 980) +
  '<g transform="translate(540,1450)"><g id="reg" opacity="0"><rect class="k" x="-330" y="-56" width="660" height="112" rx="56" fill="#0b1f10" stroke="#ffd36b" stroke-width="6"/><text y="18" text-anchor="middle" class="lbl" font-size="50" fill="#ffd36b">tax 7.375%, always at the register</text></g></g>');
K.cut(tl, "#s1", "#s2", V[2] - 0.3);
K.counter(tl, "#n750", 0, 750, V[3] - 0.4, 1.0);
tl.fromTo(".tt2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.18, ease: "back.out(2.4)", immediateRender: false }, V[4] + 0.3);
K.pop(tl, "#reg", V[5] + 0.2, 0.5);

// ---------- S3: twist — sales fell ~8% ----------
K.add("#s3", '<text x="540" y="540" text-anchor="middle" class="lbl" font-size="58" fill="#dff5e4">units sold of tagged products</text>' +
  '<line x1="160" y1="1300" x2="920" y2="1300" stroke="#dff5e4" stroke-width="6"/>' +
  '<rect class="k" id="b1" x="200" y="700" width="240" height="600" fill="#9aa69c" stroke-width="8"/>' +
  '<rect class="k" id="b2" x="640" y="' + (1300 - 600 * 0.92) + '" width="240" height="' + 600 * 0.92 + '" fill="#ff9a8c" stroke-width="8"/>' +
  '<text id="v8" x="760" y="' + (1300 - 600 * 0.92 - 30) + '" text-anchor="middle" class="num" font-size="80" fill="#fff" opacity="0">≈ −8%</text>' +
  '<g class="lbl" font-size="50" fill="#dff5e4"><text x="320" y="1370" text-anchor="middle">usual tags</text><text x="760" y="1370" text-anchor="middle">+ tax tags</text></g>');
K.cut(tl, "#s2", "#s3", V[6] - 0.3);
tl.fromTo("#b1", { scaleY: 0, svgOrigin: "320 1300" }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, V[6]);
tl.fromTo("#b2", { scaleY: 0, svgOrigin: "760 1300" }, { scaleY: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, V[6] + 0.3);
K.pop(tl, "#v8", V[6] + 0.8, 1.8);
K.camera(tl, "#cam", [[V[6] + 0.6, 1.06, -20, 0, 0.3], [V[7] - 0.3, 1, 0, 0, 0.4]]);

// ---------- S4: they knew the tax, didn't compute it; loop ----------
K.add("#s4", K.person("kid", "kid", { x: 330, y: 1000, s: 0.45 }) +
  '<g transform="translate(780,760)"><g id="bub" opacity="0"><ellipse class="k" rx="200" ry="110" fill="#fff" stroke-width="8"/><text y="-10" text-anchor="middle" class="lbl" font-size="48" fill="#142e1a">tax? 7.375%</text><text y="50" text-anchor="middle" class="lbl" font-size="48" fill="#2f8a52">I know ✓</text></g></g>' +
  '<g transform="translate(780,1120)"><g id="calc" opacity="0"><rect class="k" x="-110" y="-150" width="220" height="300" rx="20" fill="#2b2f45" stroke-width="8"/><rect x="-86" y="-126" width="172" height="70" rx="8" fill="#cfe9d4"/>' +
  '<text id="calcT" x="70" y="-76" text-anchor="end" class="num" font-size="40" fill="#142e1a">0</text>' +
  (function () { var m = ""; for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) m += '<rect x="' + (-86 + c * 62) + '" y="' + (-36 + r * 58) + '" width="48" height="44" rx="8" fill="#5c6477"/>'; return m; })() + '</g></g>' +
  '<g transform="translate(330,1350)"><g id="cart"><path class="k" d="M-120,-60 L120,-60 L100,40 L-100,40 Z" fill="#c9ced8" stroke-width="7"/><circle cx="-70" cy="70" r="22" fill="#0d0f22"/><circle cx="70" cy="70" r="22" fill="#0d0f22"/>' +
  '<g id="items"><rect x="-90" y="-120" width="50" height="70" rx="8" fill="#ff9ec4"/><rect x="-30" y="-140" width="50" height="90" rx="8" fill="#9fe3ff"/><rect x="30" y="-110" width="50" height="60" rx="8" fill="#ffd36b"/></g></g></g>');
K.cut(tl, "#s3", "#s4", V[7] - 0.3);
K.pop(tl, "#bub", V[7] + 0.3, 0.5);
K.face(tl, "kid", { m: "smile", look: [40, -20] }, V[7] + 0.3);
K.pop(tl, "#calc", V[8], 0.5);
K.face(tl, "kid", { m: "flat", e: "s", look: [0, 0] }, V[8] + 0.4);
K.words("#t4", "knew it. didn't <b>add</b> it."); K.title(tl, "#t4", V[8]);
tl.to("#t4", { opacity: 0, duration: 0.2 }, V[9] - 0.2);
// loop: the kid adds the tax, the cart loses an item
tl.set("#calcT", { textContent: "+7.375%", attr: { "font-size": 30 } }, V[9] + 0.3);
K.face(tl, "kid", { m: "smile", e: "n", look: [40, 10], blush: 0.6 }, V[9] + 0.4);
tl.to("#items rect:last-child", { y: -300, x: 200, opacity: 0, rotation: 40, duration: 0.6, ease: "power2.in" }, V[9] + 1.0);
K.react(tl, "kid", V[9] + 0.5);
K.words("#t5", "add the <b>tax</b> first"); K.title(tl, "#t5", V[9]);
tl.set({}, {}, window.DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>
